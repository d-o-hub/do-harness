# Pinned toolchain: CI and local builds use the exact same compiler.
#
# Bumping this file is a deliberate act: update the version, run
# `do-harness verify` locally, and let the MSRV job guard `rust-version`. That
# job selects `rust-version` explicitly through RUSTUP_TOOLCHAIN, because this
# file otherwise wins and the check never sees the MSRV compiler.
[toolchain]
channel = "1.98.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
