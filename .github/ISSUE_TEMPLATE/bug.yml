name: Bug report
description: Report a defect in do-harness or one of its integrations
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A triaged issue is required before a fix
        can be contributed (see CONTRIBUTING.md).
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: Tell us what you see.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact steps, commands, and inputs.
      placeholder: |
        1. Run `do-harness verify --set verification`
        2. Observe the failure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, do-harness version (`do-harness --version`), and checkout SHA.
      placeholder: e.g. Linux 6.8, do-harness v0.4.8
    validations:
      required: false
  - type: checkboxes
    id: triage
    attributes:
      label: Triage checklist
      options:
        - label: This is a bug report, not a feature request.
          required: true
        - label: I searched open issues and this is not a duplicate.
          required: true
