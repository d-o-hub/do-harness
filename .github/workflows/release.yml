name: release

# Publishing contract:
#   - `v*` tag push: preflight verifies the tagged commit, the matrix builds
#     and dogfoods each target, then the release job publishes the tarballs
#     plus `checksums.txt` as a GitHub Release. The tag must equal the
#     `[workspace.package].version` in Cargo.toml.
#   - tagged `workflow_dispatch`: release that tag end to end —
#     `gh workflow run release.yml -f tag=vX.Y.Z`. A dispatch runs *this* file
#     (the default branch's) against the tag's commit, so a pipeline fix applies
#     to an already-pushed tag without deleting and re-pushing it. Every publish
#     step is idempotent: crates.io and npm versions already published are
#     skipped, and an existing GitHub Release has its assets replaced.
#   - untagged `workflow_dispatch`: dry run — build and dogfood every target but
#     never release. Set `publish` to also publish the workspace version to
#     crates.io and npm (bootstrap path for a version whose tag predates the
#     publish job); binaries and the Release still require a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.1). Empty = dry run on this ref."
        type: string
        default: ""
      publish:
        description: "Dry run only: also publish the workspace version to crates.io and npm"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  # The tag this run releases. A tag push carries it in `github.ref_name`; the
  # recovery dispatch passes it as an input. Jobs that must act on the tag
  # rather than on the triggering ref read RELEASE_TAG, and `inputs.tag` is the
  # switch that says "this dispatch names a tag".
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  # Keyed on the effective release tag, not on the triggering ref: a `vX.Y.Z`
  # tag push runs under `refs/tags/vX.Y.Z`, while a recovery dispatch
  # (`gh workflow run release.yml -f tag=vX.Y.Z`) runs under the default branch,
  # so keying on `github.ref` put the two runs in different groups and let them
  # race over the same GitHub Release. A tag push supplies `github.ref_name` (the
  # tag) with no input; a dispatch supplies `inputs.tag`, falling back to the ref
  # name for an untagged dry run.
  group: release-${{ inputs.tag || github.ref_name }}
  # `queue: max` so more than one pending run can wait in the group. The default
  # (`single`) cancels an already-`pending` run when a new run is queued into the
  # same group, so a recovery dispatch that lands while the tag push is still
  # pending would cancel the push — and the release would have to be dispatched
  # again by hand. `cancel-in-progress` must stay false: `queue: max` with
  # `cancel-in-progress: true` is a workflow validation error.
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    # Pinned rather than `ubuntu-latest`: the label migrates to Ubuntu 26.04
    # over the weeks from 2026-10-19 and the documented mitigation is to pin
    # the image (https://github.com/actions/runner-images/issues/14748). The
    # instrumented preflight is the part most sensitive to a system-library
    # change.
    runs-on: ubuntu-24.04
    # The release set includes `coverage`, which instruments and re-runs the
    # workspace tests on top of the verification set; keep headroom.
    timeout-minutes: 45
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # A tagged dispatch releases that tag's commit, not the dispatched ref.
          ref: ${{ inputs.tag || github.ref }}
          # Full history so commitlint and git metadata see the tagged commit.
          fetch-depth: 0
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Resolve workspace version
        id: version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Assert the tag matches the workspace version
        # A tag push always names its tag, and so does a tagged dispatch — there
        # the assertion is what refuses `-f tag=` pointing at the wrong commit.
        if: github.event_name == 'push' || inputs.tag
        run: |
          expected="v${{ steps.version.outputs.version }}"
          test "$expected" = "${RELEASE_TAG}" || {
            echo "FAIL: tag ${RELEASE_TAG} does not match workspace version ${expected}" >&2
            exit 1
          }
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          # Every tool the `release` set's sensors invoke: cargo-deny (deps),
          # cargo-audit (audit), cargo-nextest (test), cargo-llvm-cov
          # (coverage). rustfmt and clippy come from the toolchain components
          # above, shellcheck from the runner image, actionlint from the pinned
          # download below, markdownlint/yamllint and the docs tooling's
          # markdown-it-py from the step below. Adding a
          # sensor that needs a new tool means adding
          # it here too: the absence of cargo-nextest failed the v0.1.2 tag
          # preflight with "error: no such command: `nextest`" -> weak evidence.
          tool: cargo-deny,cargo-audit,cargo-nextest,cargo-llvm-cov,shellcheck,cargo-semver-checks@0.50.0
      - name: Install actionlint
        # The `release` set includes the `actionlint` sensor and this job runs
        # with `DO_HARNESS_REQUIRE_TOOLS=1`, so a missing tool is a hard failure
        # rather than a SKIP. `actionlint` is not in `taiki-e/install-action`'s
        # supported-tool list, so fetch the pinned release tarball and verify its
        # published SHA-256 (same version/digest pair as verify.yml).
        run: |
          version=1.7.7
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/$archive" \
            | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" \
            --directory "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install markdownlint, yamllint, and docs tooling
        # `skills-docs` parses maintained markdown, so its markdown-it-py
        # dependency (scripts/requirements-docs.txt) must be present before the
        # release set runs; the same install backs `docs-sync`, `docs-examples`,
        # and `docs-links`, which the release set includes as error-severity
        # contracts. Those checks are offline — `docs-links` resolves link
        # targets inside this checkout, and none assert registry availability —
        # so a tag preflight can run them without network. yamllint covers the
        # workflow lint.
        run: |
          python3 -m pip install --disable-pip-version-check yamllint -r scripts/requirements-docs.txt
          npm install -g markdownlint-cli2
      - name: Check Rust public API compatibility
        run: bash scripts/check-rust-api-compatibility.sh
      - name: Upload API compatibility report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semver-checks-report
          path: target/semver-checks-reports/*
          if-no-files-found: ignore
      - name: Check package contracts
        run: bash scripts/check-package-contract.sh
      - name: Build harness CLI
        run: cargo build --release -p do-harness
      - name: Add swap headroom for the instrumented run
        # A hosted runner has 16 GB RAM and a 14 GB SSD
        # (https://docs.github.com/en/actions/reference/runners/github-hosted-runners).
        # `coverage` instruments and re-runs the whole suite, and the v0.3.3
        # preflight was shut down with a runner shutdown signal a few minutes
        # in. 4 GB of swap on the ephemeral disk turns such a spike into
        # paging; the caps on the verify step below bound the peak. `dd` rather
        # than `fallocate`: swapon(8) warns that preallocated files can be
        # treated as holes depending on the filesystem and calls dd from
        # /dev/zero the most portable solution.
        run: |
          swapfile=/mnt/do-harness-swapfile
          sudo dd if=/dev/zero of="$swapfile" bs=1M count=4096 status=none
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile" >/dev/null
          sudo swapon "$swapfile"
          free -m
          df -h / /mnt
      - name: Verify the tagged commit
        env:
          # check-audit.sh / check-deps.sh / check-shell.sh fail closed when
          # CI=true; cargo-audit and cargo-deny are installed above.
          CI: "true"
          DO_HARNESS_REQUIRE_TOOLS: "1"
          # `coverage` is the heaviest sensor in the release set. One compiler
          # (CARGO_BUILD_JOBS, Cargo's "number of parallel jobs") and one test
          # (NEXTEST_TEST_THREADS, nextest's "number of tests to run
          # simultaneously") at a time keep the peak inside the runner's RAM;
          # the swap above absorbs the rest.
          CARGO_BUILD_JOBS: "1"
          NEXTEST_TEST_THREADS: "1"
          # glibc creates one malloc arena per thread by default; the
          # instrumented suite is thread-heavy, and capping arenas trims RSS
          # without changing test scheduling.
          MALLOC_ARENA_MAX: "2"
        # The whole release pack, not just `verification`: the `release` set is
        # where `coverage` lives, so this is the one place the 70% line
        # threshold actually gates an artifact. Coverage is warn-severity and
        # `--strict` turns a sub-threshold run into a failure here.
        #
        # This is also the docs contract gate: the `release` set carries
        # `docs-sync`, `docs-examples`, and `docs-links`, so a stale generated
        # block, an invalid example, or a broken local link fails the tag here,
        # before `build` — the job that packages the artifacts — starts.
        # A runner shutdown skips every later step, including `if: failure()`,
        # so stream the resource state instead of reporting it only after the
        # fact.
        run: |
          (
            while true; do
              printf '%s ' "$(date -u +%H:%M:%S)"
              free -m | awk 'NR==2 {printf "mem_used=%sMiB mem_avail=%sMiB ", $3, $7} NR==3 {printf "swap_used=%sMiB swap_free=%sMiB ", $3, $4}'
              df -h / | awk 'NR==2 {printf "disk_used=%s disk_avail=%s", $3, $4}'
              printf '\n'
              ps -eo pid,rss,etime,comm --sort=-rss | awk 'NR==1 || NR<=6'
              sleep 15
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          ./target/release/do-harness verify --set release --format json --strict
      - name: Assert the release evidence is green and complete
        # `--strict` above already fails on any non-passing sensor, but a missing,
        # empty, or stale artifact must not read as a pass either, so the release
        # set's evidence is asserted the way verify.yml asserts the verification
        # set's. `status` re-reads the recorded artifact (missing, red, and stale
        # all fail); the explicit checks then refuse a document that names another
        # signal set or carries no tagged commit, i.e. evidence that proves
        # nothing about this tag.
        run: |
          ./target/release/do-harness status --set release --format json
          test -f .do-harness/evidence.release.json
          test -n "$(jq -r '.git_sha // empty' .do-harness/evidence.release.json)"
          test "$(jq -r '.signal_set' .do-harness/evidence.release.json)" = "release"
      - name: Report resource state when preflight fails
        # A killed runner reports only exit 143 and a shutdown signal. Record
        # memory, swap, and disk before the log is lost so the next failure
        # names the exhausted resource instead of guessing.
        if: failure()
        run: |
          free -m || true
          swapon --show || true
          df -h || true
          du -sh target 2>/dev/null || true
          sudo dmesg --ctime | tail -n 40 || true

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries run on any glibc distribution and in minimal
          # containers. `musl-tools` provides musl-gcc for the cc crate.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
            binary: do-harness
            archive: tar.gz
          # Native ARM runner (free for public repositories). If the label is
          # unavailable, fall back to `cross`/`cargo-zigbuild` on ubuntu-latest.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
            binary: do-harness
            archive: tar.gz
          # Both Darwin targets build on the arm64 runner; the x86_64 target
          # cross-compiles with Apple clang.
          - target: x86_64-apple-darwin
            os: macos-14
            musl: false
            binary: do-harness
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            musl: false
            binary: do-harness
            archive: tar.gz
          # Windows ships a zip (Explorer-friendly; cargo-binstall tries every
          # supported archive format, so the zip is discovered by default).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            musl: false
            binary: do-harness.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      # Provenance is signed through Sigstore: a token is minted here and the
      # resulting attestation is stored against the artifact's digest, so no
      # long-lived signing key exists.
      id-token: write
      attestations: write
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Resolve workspace version
        id: version
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      # The dogfood `init` executes the generated contract, whose deps/audit
      # sensors fail closed when CI=true. Install the optional tools the
      # generated pack probes, mirroring verify.yml's dogfood environment.
      # taiki-e/install-action@v2
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-deny,cargo-audit
      # actions/setup-python@v6; tomllib and tarfile's data filter need Python 3.12.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Build release binary
        run: cargo build --release --locked -p do-harness --target ${{ matrix.target }}
      - name: Smoke-test the binary
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} version --format json
      - name: Dogfood init + verify with the release binary
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --root "$tmp" init
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --root "$tmp" verify --format json --strict
      - name: Validate packaged source distribution and prebuilt database teardown
        shell: bash
        run: |
          python scripts/test_source_distribution.py 2>&1 | tee distribution-validation.log
          python scripts/check_source_distribution.py --mode packaged \
            --target "${{ matrix.target }}" \
            --prebuilt "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            2>&1 | tee -a distribution-validation.log
      - name: Upload distribution validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: distribution-${{ matrix.target }}
          path: distribution-validation.log
          if-no-files-found: error
      - name: Package the release artifact
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          name="do-harness-v${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a "${name}.zip" "$name" >/dev/null)
          else
            tar -czf "dist/${name}.tar.gz" -C dist "$name"
          fi
          rm -rf "dist/$name"
          ls -l dist
      # actions/attest-build-provenance@v4.2.2
      - name: Attest the artifact's build provenance
        # Signed inside the job that produced the archive, so the attestation
        # names the workflow, ref, and commit that actually built it rather than
        # a later reaggregation step. `checksums.txt` protects integrity; this
        # protects origin. Verify with `gh attestation verify <file> --repo …`
        # (docs/releasing.md, "Verifying a download").
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*
      # actions/upload-artifact@v7.0.1
      - name: Upload the release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    # A GitHub Release is the user-visible claim that a version shipped, so it
    # waits for both publication paths: `v0.1.2` created this Release while
    # `npm-publish` was red, leaving a complete Release next to a version that
    # was never on npm.
    needs: [build, publish, registry-validation, npm-publish]
    # A tag push or a tagged dispatch releases; an untagged dispatch is a dry run.
    if: github.event_name == 'push' || inputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Least privilege: read source, write the release and its assets.
      contents: write
    steps:
      # actions/checkout@v7.0.1
      #
      # `fetch-depth: 0` so `git describe` can name the previous tag, which scopes
      # the generated changelog to this release instead of the whole history.
      # Credentials are not persisted: the job publishes through GH_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      # actions/download-artifact@v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum do-harness-* > checksums.txt
          cat checksums.txt
      - name: Self-check artifacts against the generated checksums
        # `checksums.txt` is what a downloader verifies against, so the job that
        # advertises it should verify it too, before the Release exists. The
        # `artifact-provenance` sensor is the tested digest-only verifier;
        # `check-rust-binary-provenance.sh` cannot stand in here because it
        # requires cargo-auditable metadata, which this plain
        # `cargo build --release` does not embed, and both scripts check one
        # expected digest per artifact, which is why each line is fed in turn.
        run: |
          set -euo pipefail
          while read -r digest name; do
            bash scripts/check-artifact-provenance.sh \
              --artifact "dist/$name" \
              --digest "$digest" \
              --mode digest-only
          done < dist/checksums.txt
      - name: Compose release notes
        # GitHub's generated changelog (the merged pull requests since the
        # previous tag) is regrouped by conventional-commit type and appended to
        # a curated header: `docs/releases/<tag>.md` when that file exists at the
        # tagged commit, otherwise `.github/release-notes-template.md`. Both live
        # in the repository, so the shipped body is reviewable before the tag.
        # `check` refuses a body that is missing a section, so a release cannot
        # ship a bare commit dump. See docs/releasing.md ("Release notes").
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          api=(--method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes"
            -f "tag_name=${RELEASE_TAG}"
            -f "configuration_file_path=.github/release.yml")
          if [ -n "$previous" ]; then
            api+=(-f "previous_tag_name=$previous")
          fi
          gh api "${api[@]}" --jq .body > generated-notes.md
          bash scripts/release-notes.sh compose "${RELEASE_TAG}" generated-notes.md release-notes.md
          bash scripts/release-notes.sh check "${RELEASE_TAG}" release-notes.md
          echo "composed release notes ($(wc -l < release-notes.md) lines)"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Idempotent so a tagged dispatch can re-run a release that failed
        # halfway: an existing Release has its body and assets replaced rather
        # than the job failing on "already exists".
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/do-harness-* dist/checksums.txt --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "do-harness ${RELEASE_TAG}" --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "do-harness ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              dist/do-harness-* dist/checksums.txt
          fi

  publish:
    # crates.io versions are immutable, so publishing is gated on the same
    # preconditions as the binary release: a version tag whose commit passed
    # preflight and whose full build matrix (and dogfood) succeeded. The tagged
    # dispatch path re-runs a release; the untagged `publish` input is the
    # bootstrap path for a version whose tag predates the publish job.
    needs: [preflight, build]
    if: github.event_name == 'push' || inputs.tag || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Serialized repository-wide: the skip-if-published probe below is
    # check-then-act, and a publish is permanent, so two runs must not race the
    # same version into crates.io (or into cargo's blind retry loop).
    concurrency:
      group: crates-io-publish-${{ github.repository }}
      # `queue: max` keeps an already-`pending` publish queued instead of letting
      # the default single-pending slot cancel it: a crates.io version is
      # immutable and a publish is permanent, so a canceled pending run must be
      # re-triggered by hand. Never `cancel-in-progress: true` here — with
      # `queue: max` that combination is a workflow validation error, and
      # canceling a publish mid-flight is exactly what the group exists to stop.
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      # OIDC: the job exchanges a GitHub-issued identity token for a
      # short-lived crates.io token, so this pipeline holds no long-lived
      # publish credential (docs/releasing.md, crates.io Trusted Publishing).
      id-token: write
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: publish
      # rust-lang/crates-io-auth-action@v1.0.5
      #
      # Exchanges the job's OIDC token for a short-lived crates.io token. The
      # step output is scoped to the publish step below, so the credential never
      # exists as a secret and expires with the run.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: crates-auth
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "FAIL: no crates.io token was issued; configure Trusted Publishing for every published crate (see docs/releasing.md)" >&2
            exit 1
          fi
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          published() {
            curl -fsS -A "do-harness-release-workflow (https://github.com/d-o-hub/do-harness)" \
              -o /dev/null "https://crates.io/api/v1/crates/$1/$2"
          }
          publish() {
            local crate="$1" crate_version="$2" manifest="$3" attempt=1
            local features=() out
            if [ "$crate" = "do-harness-libsql" ]; then
              features=(--no-default-features --features core)
            fi
            if published "$crate" "$crate_version"; then
              echo "$crate $crate_version is already on crates.io; skipping"
              return 0
            fi
            out="$(mktemp)"
            while true; do
              if cargo publish --locked --manifest-path "$manifest" "${features[@]}" >"$out" 2>&1; then
                cat "$out"
                rm -f "$out"
                return 0
              fi
              cat "$out"
              if grep -q "already exists on crates.io" "$out"; then
                echo "$crate $crate_version is already on crates.io; skipping"
                rm -f "$out"
                return 0
              fi
              if grep -q "Trusted Publishing tokens do not support creating new crates" "$out"; then
                echo "FAIL: $crate is new on crates.io; publish it once with an API token, then configure its trusted publisher (see docs/releasing.md)" >&2
                rm -f "$out"
                return 1
              fi
              if [ "$attempt" -ge 8 ]; then
                echo "FAIL: could not publish $crate after $attempt attempts" >&2
                rm -f "$out"
                return 1
              fi
              attempt=$((attempt + 1))
              echo "retrying $crate in 15s (registry index propagation)"
              sleep 15
            done
          }
          fork_version="$(sed -n '/^\[package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' vendor/libsql/Cargo.toml)"
          test -n "$fork_version"
          publish do-harness-libsql "$fork_version" vendor/libsql/Cargo.toml
          publish do-harness-types "$version" crates/types/Cargo.toml
          publish do-harness-db "$version" crates/db/Cargo.toml
          publish do-harness "$version" crates/do-harness/Cargo.toml

  registry-validation:
    # Published versions are immutable. This gate checks the actual registry
    # implementation before any binary or npm release can be advertised.
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Validate registry installation
        shell: bash
        run: |
          python scripts/check_source_distribution.py --mode registry \
            --target "${{ matrix.target }}" 2>&1 | tee registry-validation.log
      - name: Upload registry validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: registry-${{ matrix.target }}
          path: registry-validation.log
          if-no-files-found: error

  npm-publish:
    # The npm wrapper ships the same prebuilt binaries as the GitHub release,
    # so it is gated on the same preconditions. Platform packages publish
    # first, then the meta package whose optionalDependencies pin them.
    needs: [preflight, build, registry-validation]
    if: github.event_name == 'push' || inputs.tag || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm versions are immutable too: serialize the platform-then-meta sequence
    # so two runs cannot interleave a partially published set.
    concurrency:
      group: npm-publish-${{ github.repository }}
      # `queue: max` keeps an already-`pending` publish queued instead of letting
      # the default single-pending slot cancel it: npm versions are immutable, so
      # a canceled pending run drops a release that must then be re-triggered by
      # hand. `cancel-in-progress` must stay false — `queue: max` plus
      # `cancel-in-progress: true` is a workflow validation error.
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      # actions/download-artifact@v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      # actions/setup-node@v7.0.0
      #
      # `package-manager-cache: false` is deliberate: this job holds
      # `id-token: write`, and npm's own trusted-publishing example disables
      # automatic caching in release builds ("never use caching in release
      # builds"). A poisoned npm cache is executable input to a privileged
      # publish, so this job trades install speed for a smaller attack surface.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm trusted publishing prerequisites
        run: |
          node_version="$(node --version | sed 's/^v//')"
          npm_version="$(npm --version)"
          node_major="${node_version%%.*}"
          node_minor="${node_version#*.}"
          node_minor="${node_minor%%.*}"
          if (( node_major < 22 || (node_major == 22 && node_minor < 14) )); then
            echo "FAIL: npm trusted publishing requires Node >= 22.14.0 (got v$node_version)" >&2
            exit 1
          fi
          npm_major="${npm_version%%.*}"
          npm_minor="${npm_version#*.}"
          npm_minor="${npm_minor%%.*}"
          npm_patch="${npm_version#*.*.}"
          npm_patch="${npm_patch%%.*}"
          if (( npm_major < 11 ||
            (npm_major == 11 && (npm_minor < 5 ||
              (npm_minor == 5 && npm_patch < 1))) )); then
            echo "FAIL: npm trusted publishing requires npm >= 11.5.1 (got $npm_version)" >&2
            exit 1
          fi
          printf 'Using Node v%s and npm %s for GitHub OIDC publishing\n' "$node_version" "$npm_version"
      - name: Publish npm packages
        run: bash scripts/publish-npm.sh --dist dist

  verify-published:
    # Post-publication proof, from the consumer's side: the Release's own assets,
    # the installer's result, npm and crates.io. Report-only first — the job runs,
    # its log carries the verdict, and `continue-on-error` keeps a failure out of
    # the release gate until the ratchet moves (docs/releasing.md, "Verifying a
    # published release"). Deleting that line is the next position; passing
    # `--require-immutable` to the script is the last one.
    #
    # npm is part of the published surface, so wait for its job before probing:
    # the registry can keep serving the previous `dist-tags` for a few minutes
    # after `npm publish` reports success, and the probe below polls through
    # that window rather than reading propagation as a missing artifact.
    needs: [release, npm-publish]
    continue-on-error: true
    if: github.event_name == 'push' || inputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Read the released source and assets; no write anywhere.
      contents: read
      # `gh attestation verify` reads the archive's build provenance.
      attestations: read
    steps:
      # actions/checkout@v7.0.1
      #
      # The tree must be the released one: the verifier compares the tag with the
      # workspace version and reads the crate pins from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          work="$(mktemp -d)"
          facts="$work/facts.env"
          : >"$facts"
          # Every query below writes `missing` when it fails: an outage must not
          # read as a pass, and the verifier treats an absent fact the same way.
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "release=present" >>"$facts"
          else
            echo "release=missing" >>"$facts"
          fi
          gh release download "$TAG" --dir "$work/assets" || true
          # npm's registry can serve a just-published version minutes after
          # `npm publish` reports success (v0.3.4 was still `missing` 24s after
          # the publish job finished). Poll instead of reading that propagation
          # delay as a missing artifact; the bound keeps a real outage failing
          # the job instead of waiting forever.
          poll_npm() {
            local query="$1" value=""
            for _ in $(seq 1 20); do
              value="$(npm view "$query" 2>/dev/null || true)"
              if [ -n "$value" ]; then
                printf '%s\n' "$value"
                return 0
              fi
              sleep 15
            done
            return 1
          }
          if npm_version="$(poll_npm "do-harness@$version" version)"; then
            echo "npm=$npm_version" >>"$facts"
          else
            echo "npm=missing" >>"$facts"
          fi
          if [ -n "$(poll_npm "do-harness@$version" dist.attestations.url || true)" ]; then
            echo "npm_provenance=ok" >>"$facts"
          else
            echo "npm_provenance=missing" >>"$facts"
          fi
          latest="$(npm view do-harness dist-tags.latest 2>/dev/null || true)"
          if [ -n "$latest" ]; then
            echo "npm_latest=$latest" >>"$facts"
          fi
          ua="do-harness verify-published (github.com/${GITHUB_REPOSITORY})"
          crates=""
          for crate in do-harness do-harness-db do-harness-types; do
            if curl -fsSL -A "$ua" "https://crates.io/api/v1/crates/$crate" |
              jq -e --arg v "$version" 'any(.versions[]; .num == $v)' >/dev/null; then
              crates="${crates:+$crates,}$crate=$version"
            else
              crates="${crates:+$crates,}$crate=missing"
            fi
          done
          echo "crates=$crates" >>"$facts"
          # The installer is the consumer's own path to the binary.
          if bash scripts/install.sh --version "$TAG" --bin-dir "$work/bin" >/dev/null 2>&1 &&
            reported="$("$work/bin/do-harness" --version 2>/dev/null | awk '{print $2}')" &&
            [ -n "$reported" ]; then
            echo "install=$reported" >>"$facts"
          else
            echo "install=missing" >>"$facts"
          fi
          archive="$work/assets/do-harness-${TAG}-x86_64-unknown-linux-musl.tar.gz"
          if [ -f "$archive" ] &&
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "attestation=ok" >>"$facts"
          else
            echo "attestation=missing" >>"$facts"
          fi
          if gh release verify "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "immutable=ok" >>"$facts"
          else
            echo "immutable=missing" >>"$facts"
          fi
          cat "$facts"
          bash scripts/verify-published.sh --tag "$TAG" --dir "$work/assets" --facts "$facts"
