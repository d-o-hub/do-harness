name: release

# Publishing contract:
#   - `v*` tag push: preflight verifies the tagged commit, the matrix builds
#     and dogfoods each target, then the release job publishes the tarballs
#     plus `checksums.txt` as a GitHub Release. The tag must equal the
#     `[workspace.package].version` in Cargo.toml.
#   - `workflow_dispatch`: dry run — build and dogfood every target but never
#     publish binaries. Set `publish` to also publish the workspace version to
#     crates.io (bootstrap path for a version whose tag predates the publish
#     job); binary release still requires a tag push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the workspace version to crates.io and npm"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so commitlint and git metadata see the tagged commit.
          fetch-depth: 0
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Resolve workspace version
        id: version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Assert the tag matches the workspace version
        if: github.event_name == 'push'
        run: |
          expected="v${{ steps.version.outputs.version }}"
          test "$expected" = "${GITHUB_REF_NAME}" || {
            echo "FAIL: tag ${GITHUB_REF_NAME} does not match workspace version ${expected}" >&2
            exit 1
          }
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          # Every tool the `verification` set's sensors invoke: cargo-deny
          # (deps), cargo-audit (audit), cargo-nextest (test). rustfmt and
          # clippy come from the toolchain components above, shellcheck from
          # the runner image, markdownlint/yamllint from the step below.
          # Adding a sensor that needs a new tool means adding it here too:
          # the absence of cargo-nextest failed the v0.1.2 tag preflight with
          # "error: no such command: `nextest`" -> weak evidence.
          tool: cargo-deny,cargo-audit,cargo-nextest,shellcheck
      - name: Install markdownlint and yamllint
        run: |
          python3 -m pip install --disable-pip-version-check yamllint
          npm install -g markdownlint-cli2
      - name: Build harness CLI
        run: cargo build --release -p do-harness
      - name: Verify the tagged commit
        env:
          # check-audit.sh / check-deps.sh / check-shell.sh fail closed when
          # CI=true; cargo-audit and cargo-deny are installed above.
          CI: "true"
          DO_HARNESS_REQUIRE_TOOLS: "1"
        run: ./target/release/do-harness verify --set verification --format json --strict

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries run on any glibc distribution and in minimal
          # containers. `musl-tools` provides musl-gcc for the cc crate.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
            binary: do-harness
            archive: tar.gz
          # Native ARM runner (free for public repositories). If the label is
          # unavailable, fall back to `cross`/`cargo-zigbuild` on ubuntu-latest.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
            binary: do-harness
            archive: tar.gz
          # Both Darwin targets build on the arm64 runner; the x86_64 target
          # cross-compiles with Apple clang.
          - target: x86_64-apple-darwin
            os: macos-14
            musl: false
            binary: do-harness
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            musl: false
            binary: do-harness
            archive: tar.gz
          # Windows ships a zip (Explorer-friendly; cargo-binstall tries every
          # supported archive format, so the zip is discovered by default).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            musl: false
            binary: do-harness.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Resolve workspace version
        id: version
        shell: bash
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      # The dogfood `init` executes the generated contract, whose deps/audit
      # sensors fail closed when CI=true. Install the optional tools the
      # generated pack probes, mirroring verify.yml's dogfood environment.
      # taiki-e/install-action@v2
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-deny,cargo-audit
      - name: Build release binary
        run: cargo build --release --locked -p do-harness --target ${{ matrix.target }}
      - name: Smoke-test the binary
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} version --format json
      - name: Dogfood init + verify with the release binary
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --root "$tmp" init
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --root "$tmp" verify --format json --strict
      - name: Package the release artifact
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          name="do-harness-v${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a "${name}.zip" "$name" >/dev/null)
          else
            tar -czf "dist/${name}.tar.gz" -C dist "$name"
          fi
          rm -rf "dist/$name"
          ls -l dist
      # actions/upload-artifact@v7.0.1
      - name: Upload the release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    # Dispatch is a dry run; only a tag push publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Least privilege: read source, write the release and its assets.
      contents: write
    steps:
      # actions/checkout@v7.0.1
      #
      # `fetch-depth: 0` so `git describe` can name the previous tag, which scopes
      # the generated changelog to this release instead of the whole history.
      # Credentials are not persisted: the job publishes through GH_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/download-artifact@v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum do-harness-* > checksums.txt
          cat checksums.txt
      - name: Compose release notes
        # GitHub's generated changelog (categorized by .github/release.yml) is
        # appended to the curated header in .github/release-notes-template.md:
        # highlights, install commands, and how to verify the download are what
        # users need, and no generator can write them. See docs/releasing.md.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          api=(--method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes"
            -f "tag_name=${GITHUB_REF_NAME}"
            -f "configuration_file_path=.github/release.yml")
          if [ -n "$previous" ]; then
            api+=(-f "previous_tag_name=$previous")
          fi
          gh api "${api[@]}" --jq .body > generated-notes.md
          sed -e "s/{{TAG}}/${GITHUB_REF_NAME}/g" -e "s/{{VERSION}}/${version}/g" \
            .github/release-notes-template.md > release-notes.md
          printf '\n---\n\n# Changes\n\n' >> release-notes.md
          cat generated-notes.md >> release-notes.md
          echo "composed release notes ($(wc -l < release-notes.md) lines)"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "do-harness ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/do-harness-* dist/checksums.txt

  publish:
    # crates.io versions are immutable, so publishing is gated on the same
    # preconditions as the binary release: a version tag whose commit passed
    # preflight and whose full build matrix (and dogfood) succeeded. The
    # dispatch path is the bootstrap/re-run escape hatch.
    needs: [preflight, build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Create a token at https://crates.io/settings/tokens and store it as
      # the CARGO_REGISTRY_TOKEN repository secret (see docs/releasing.md).
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: publish
      - name: Publish crates in dependency order
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "FAIL: CARGO_REGISTRY_TOKEN is not configured (see docs/releasing.md)" >&2
            exit 1
          fi
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          published() {
            curl -fsS -A "do-harness-release-workflow (https://github.com/d-o-hub/do-harness)" \
              -o /dev/null "https://crates.io/api/v1/crates/$1/$2"
          }
          publish() {
            local crate="$1" attempt=1
            if published "$crate" "$version"; then
              echo "$crate $version is already on crates.io; skipping"
              return 0
            fi
            until cargo publish --locked -p "$crate"; do
              if [ "$attempt" -ge 8 ]; then
                echo "FAIL: could not publish $crate after $attempt attempts" >&2
                return 1
              fi
              attempt=$((attempt + 1))
              echo "retrying $crate in 15s (registry index propagation)"
              sleep 15
            done
          }
          publish do-harness-types
          publish do-harness-db
          publish do-harness

  npm-publish:
    # The npm wrapper ships the same prebuilt binaries as the GitHub release,
    # so it is gated on the same preconditions. Platform packages publish
    # first, then the meta package whose optionalDependencies pin them.
    needs: [preflight, build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/download-artifact@v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      # actions/setup-node@v7.0.0
      #
      # `package-manager-cache: false` is deliberate: this job holds
      # `id-token: write`, and npm's own trusted-publishing example disables
      # automatic caching in release builds ("never use caching in release
      # builds"). A poisoned npm cache is executable input to a privileged
      # publish, so this job trades install speed for a smaller attack surface.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm trusted publishing prerequisites
        run: |
          node_version="$(node --version | sed 's/^v//')"
          npm_version="$(npm --version)"
          node_major="${node_version%%.*}"
          node_minor="${node_version#*.}"
          node_minor="${node_minor%%.*}"
          if (( node_major < 22 || (node_major == 22 && node_minor < 14) )); then
            echo "FAIL: npm trusted publishing requires Node >= 22.14.0 (got v$node_version)" >&2
            exit 1
          fi
          npm_major="${npm_version%%.*}"
          npm_minor="${npm_version#*.}"
          npm_minor="${npm_minor%%.*}"
          npm_patch="${npm_version#*.*.}"
          npm_patch="${npm_patch%%.*}"
          if (( npm_major < 11 ||
            (npm_major == 11 && (npm_minor < 5 ||
              (npm_minor == 5 && npm_patch < 1))) )); then
            echo "FAIL: npm trusted publishing requires npm >= 11.5.1 (got $npm_version)" >&2
            exit 1
          fi
          printf 'Using Node v%s and npm %s for GitHub OIDC publishing\n' "$node_version" "$npm_version"
      - name: Publish npm packages
        run: bash scripts/publish-npm.sh --dist dist
