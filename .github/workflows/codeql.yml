name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 9 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: true
      matrix:
        language: [rust]

    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - uses: github/codeql-action/init@a0c73122a6231d3a72b4b04036548af1cd2487c9
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql-config.yml

      - run: cargo build --release

      - uses: github/codeql-action/analyze@a0c73122a6231d3a72b4b04036548af1cd2487c9
        with:
          category: /language:rust
