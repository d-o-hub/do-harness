name: verify
on:
  push:
    # A feature-branch push also fires `pull_request`, which would run this
    # workflow twice for the same commit (and the two runs then contend for the
    # same runners). Restrict the push trigger to `main` so every commit is
    # verified exactly once: by `push` on main, by `pull_request` on branches.
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Least privilege: read source, write only the evidence artifact.
      contents: read
      actions: write
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the commitlint sensor can inspect recent subjects.
          fetch-depth: 0
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          # The @rev default ignores rust-toolchain.toml; pass the pinned
          # channel so rust-toolchain.toml stays the single source of truth.
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-deny,cargo-audit,cargo-nextest,cargo-llvm-cov,shellcheck,cargo-hack,cargo-machete
      - name: Install markdownlint and yamllint
        run: |
          python3 -m pip install --disable-pip-version-check yamllint
          npm install -g markdownlint-cli2
      # Pin maintenance note: agent-governance is pinned to =3.2.2 in workspace dependencies
      # until GA. Upstream renamed this crate to `agentmesh`; the pin stays on the
      # retired 3.2.x line because the live 4.x line is a breaking API change
      # (chore-agt-promotion). Use `cargo update -p agent-governance --precise <ver>`.
      - name: Lint shell sensors
        run: shellcheck scripts/*.sh crates/do-harness/templates/scripts/*.sh
      - name: Build harness CLI
        run: cargo build --release -p do-harness
      - name: Installer end-to-end (checksum, extract, exec)
        run: bash scripts/test-install.sh --bin target/release/do-harness
      - name: Lint and test the npm wrapper
        run: |
          node --check integrations/npm/bin/do-harness.js
          node --check integrations/npm/lib/platform.js
          node --test integrations/npm/test/*.test.mjs
      - name: Browser-test web UI pack
        run: |
          mkdir -p target/web-ui-browser-deps
          npm init -y --prefix target/web-ui-browser-deps >/dev/null
          npm install --prefix target/web-ui-browser-deps --no-save --no-package-lock --no-audit --no-fund playwright@1.50.1
          target/web-ui-browser-deps/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH="$GITHUB_WORKSPACE/target/web-ui-browser-deps/node_modules" node --test integrations/web-ui/audit.browser.test.mjs
      - name: Package npm wrapper (assembly dry run)
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          dist="$(mktemp -d)"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            name="do-harness-v${version}-${target}"
            mkdir -p "$dist/pkg/$name"
            cp target/release/do-harness "$dist/pkg/$name/do-harness"
            tar -czf "$dist/${name}.tar.gz" -C "$dist/pkg" "$name"
          done
          name="do-harness-v${version}-x86_64-pc-windows-msvc"
          mkdir -p "$dist/pkg/$name"
          cp target/release/do-harness "$dist/pkg/$name/do-harness.exe"
          (cd "$dist/pkg" && zip -qr "$dist/${name}.zip" "$name")
          bash scripts/publish-npm.sh --dist "$dist" --dry-run
      - name: Check adjacent guardian-proxy crate
        run: cargo check -p guardian-proxy
      - name: Test adjacent guardian-proxy crate
        run: cargo test -p guardian-proxy && cargo test -p guardian-proxy --features agt-governance && cargo test -p guardian-proxy --features mcp-surface
      - name: Run sensors
        env:
          # check-audit.sh / check-deps.sh / check-shell.sh / check-markdownlint.sh / check-yamllint.sh
          # fail closed when CI=true; cargo-audit, cargo-deny, shellcheck, yamllint, and
          # markdownlint-cli2 are installed above.
          CI: "true"
          # Belt and braces: missing tools fail even if CI=true is dropped.
          DO_HARNESS_REQUIRE_TOOLS: "1"
        run: ./target/release/do-harness verify --set verification --format json --strict
      - name: Assert verification evidence is green
        run: ./target/release/do-harness status --set verification --format json
      - name: Run scheduled sensors
        env:
          CI: "true"
          DO_HARNESS_REQUIRE_TOOLS: "1"
        run: ./target/release/do-harness verify --set scheduled --format json --strict
      - name: Record Cargo.lock hash
        run: |
          mkdir -p .do-harness
          sha256sum Cargo.lock > .do-harness/Cargo.lock.sha256
          cat .do-harness/Cargo.lock.sha256
      - name: Record the DORA snapshot
        # Records the snapshot for this run and asserts the collector's exit
        # contract. Exit 1 is the metric verdict (a threshold breach), not a
        # recording failure: the snapshot row is written either way, and `dora`
        # is report-only by design. Exit 2 (usage/config/discovery) and any
        # other code still fails the job, so a broken collector cannot hide
        # here.
        #
        # This does NOT accumulate history across runs: `.do-harness/` is
        # gitignored local state, and CI neither caches nor uploads
        # `agent_state.db`, so the row lives only for the duration of the job.
        # Durable history means running `dora --record` on a checkout whose
        # state database persists.
        run: |
          code=0
          ./target/release/do-harness dora --record --format json || code=$?
          test "$code" -le 1
      - name: Lint full PR commit range
        # The commitlint sensor only checks COUNT=1 locally; PRs must lint
        # every non-merge commit (fetch-depth: 0 makes both SHAs available).
        if: github.event_name == 'pull_request'
        run: bash scripts/check-commitlint.sh --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Dogfood greenfield rust init + verify
        run: |
          tmp="$(mktemp -d)"
          ./target/release/do-harness --root "$tmp" init
          ./target/release/do-harness --root "$tmp" verify --format json --strict
      - name: Dogfood generic init (vacuous verify, evidenced)
        run: |
          tmp="$(mktemp -d)"
          ./target/release/do-harness --root "$tmp" init --language generic
          ./target/release/do-harness --root "$tmp" verify --format json --strict --evidence "$tmp/.do-harness/evidence.json"
          # The generic pack is empty by design: assert the artifact says so
          # instead of letting a vacuous pass masquerade as a real rust gate.
          test "$(jq -r '.sensor_pack' "$tmp/.do-harness/evidence.json")" = "generic"
      - name: Install skill tooling dependencies
        # quick_validate.py parses YAML frontmatter and needs PyYAML; declare
        # and install it rather than relying on the runner image shipping it.
        run: python3 -m pip install --disable-pip-version-check -r .agents/skills/skill-creator/scripts/requirements.txt
      - name: Dogfood skill eval runner (shebang execution, graded residue)
        run: ./target/release/do-harness eval --strict-fixtures
      - name: Assert evidence integrity
        run: |
          test -f .do-harness/evidence.verification.json
          test -n "$(jq -r '.git_sha // empty' .do-harness/evidence.verification.json)"
          test "$(jq -r '.signal_set' .do-harness/evidence.verification.json)" = "verification"
      # actions/upload-artifact@v7.0.1
      - name: Upload verify evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-evidence
          path: |
            .do-harness/evidence.verification.json
            .do-harness/Cargo.lock.sha256
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve MSRV
        id: msrv
        run: |
          msrv="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          # Installs this toolchain and makes it the rustup default. Commands
          # run inside the checkout still resolve through rust-toolchain.toml
          # unless the step sets RUSTUP_TOOLCHAIN (see the check step below).
          toolchain: ${{ steps.msrv.outputs.msrv }}
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: msrv
      - name: Check workspace on MSRV
        # rust-toolchain.toml pins the dev channel and wins over an installed
        # toolchain, so every step that must use the MSRV selects it explicitly.
        # Cargo's `rust-version` check only errors when the *selected* toolchain
        # is older than the declared minimum (`--ignore-rust-version` bypasses
        # it), so compiling with the pinned channel proves nothing about 1.85 —
        # five let-chains reached main that way. This step is source
        # compatibility for every target, including test code.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace on MSRV
        # The Cargo Book's "Verified" support expectation is "a package's
        # functionality is verified on its supported Rust versions, including
        # automated testing" (cargo/reference/rust-version.html): a type check
        # is not that, so the suite runs here on the declared minimum.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}
        run: cargo test --workspace --locked

  dsh-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build harness CLI for the bundle tests
        run: cargo build --release -p do-harness
      - name: Lint DSH bundle JavaScript
        run: node --check integrations/deepseek-harness/index.js integrations/deepseek-harness/lib/*.mjs
      - name: Test DSH bundle (unit + real-binary e2e)
        env:
          DO_HARNESS_BIN: ${{ github.workspace }}/target/release/do-harness
        run: node --test integrations/deepseek-harness/test/*.test.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: windows
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-deny,cargo-audit,cargo-nextest,cargo-llvm-cov
      # The full `cargo test --workspace` also runs on ubuntu (verify job);
      # running it here too is what makes Windows a supported platform rather
      # than a build-only target. POSIX-only tests are `#[cfg(unix)]`-gated
      # (eval walkthrough shebangs, hook exit codes, file-mode helpers) and the
      # runners provide Git Bash, so `sh`/`bash` sensors work as written.
      - name: Install skill tooling dependencies
        # quick_validate.py (the skill structure gate) parses YAML frontmatter
        # and needs PyYAML. Ubuntu images ship it; windows-latest does not, so
        # install it explicitly instead of relying on the host image.
        run: python -m pip install --disable-pip-version-check -r .agents/skills/skill-creator/scripts/requirements.txt
      - name: Install pnpm for the node init tests
        # `init::tests::init_node_pnpm_turbo_workspace_first_run_is_green`
        # declares a pnpm workspace, so its baseline can only go Green when
        # pnpm is the resolved package manager. windows-latest ships npm/yarn
        # but not pnpm, so provide it rather than letting the fixture run under
        # a package manager it does not describe.
        run: npm install --global pnpm@10
      - name: Test workspace on Windows
        # Bounded so a hung test fails in minutes rather than consuming the
        # job's full 30-minute budget with no output.
        timeout-minutes: 12
        run: cargo test --workspace --release --exclude do-harness-db
      - name: Test do-harness-db on Windows
        # The db tests each open their own temporary libSQL database. On
        # Windows that binary crashed once with STATUS_ACCESS_VIOLATION
        # (0xc0000005) after every test had reported `ok`, and the same code
        # passed on the next commit, so it is intermittent rather than a
        # deterministic failure. Serializing this crate is a cheap mitigation
        # (the suite runs in seconds) that keeps the signal without masking a
        # reproducible failure: any real test failure still fails the step.
        timeout-minutes: 8
        run: cargo test -p do-harness-db --release -- --test-threads=1
      - name: Build harness CLI
        run: cargo build --release -p do-harness
      - name: Dogfood init + verify with the release binary
        shell: bash
        env:
          # The generated pack's deps/audit sensors fail closed under CI=true;
          # cargo-deny and cargo-audit are installed above.
          CI: "true"
          DO_HARNESS_REQUIRE_TOOLS: "1"
        run: |
          tmp="$(mktemp -d)"
          ./target/release/do-harness.exe --root "$tmp" init
          ./target/release/do-harness.exe --root "$tmp" verify --format json --strict
      - name: Test the installer (including the windows zip path)
        shell: bash
        run: bash scripts/test-install.sh --bin ./target/release/do-harness.exe
      - name: Prove hook install + status and doctor on Windows
        shell: bash
        run: |
          scratch="$(mktemp -d)"
          git init -q "$scratch"
          # Seed one commit: the scaffolded commitlint sensor inspects the last
          # commit and fails in a repository with no commits, which makes init's
          # initial verification legitimately RED (exit 1).
          git -C "$scratch" -c user.email=ci@example.com -c user.name=ci \
            commit -q --allow-empty -m "chore: seed"
          ./target/release/do-harness.exe --root "$scratch" init
          bin="$PWD/target/release/do-harness.exe"
          cd "$scratch"
          DO_HARNESS_BIN="$bin" "$bin" hook install
          DO_HARNESS_BIN="$bin" "$bin" hook status
          DO_HARNESS_BIN="$bin" "$bin" doctor
      - name: Lint and test the npm wrapper
        shell: bash
        run: |
          node --check integrations/npm/bin/do-harness.js
          node --check integrations/npm/lib/platform.js
          node --test integrations/npm/test/*.test.mjs
