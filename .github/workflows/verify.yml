name: verify
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build harness CLI
        run: cargo build --release -p do-harness
      - name: Run sensors
        run: ./target/release/do-harness verify --format json
      - name: Dogfood greenfield rust init + verify
        run: |
          tmp="$(mktemp -d)"
          ./target/release/do-harness --root "$tmp" init
          ./target/release/do-harness --root "$tmp" verify --format json
      - name: Dogfood generic init (vacuous verify, documented)
        run: |
          tmp="$(mktemp -d)"
          ./target/release/do-harness --root "$tmp" init --language generic
          ./target/release/do-harness --root "$tmp" verify --format json
