name: verify
on:
  push:
    # A feature-branch push also fires `pull_request`, which would run this
    # workflow twice for the same commit (and the two runs then contend for the
    # same runners). Restrict the push trigger to `main` so every commit is
    # verified exactly once: by `push` on main, by `pull_request` on branches.
    branches: [main]
  pull_request:
  # Manual re-run: a transient runner failure or a quota exhaustion should not
  # require an empty commit to produce fresh evidence.
  workflow_dispatch:

permissions:
  contents: read

# Keep the aggregate compiler RSS bounded on the workspace's libSQL and
# feature-matrix builds. Local developers retain Cargo's CPU-count default and
# can opt into the same setting with CARGO_BUILD_JOBS=2.
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-distribution:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: do-harness
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: do-harness.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      # Swatinem/rust-cache@v2: without it this job recompiled the workspace for
      # its target from scratch on every run (P9).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Build checkout binary
        run: cargo build --release --locked -p do-harness --target ${{ matrix.target }}
      - name: Validate isolated packages and database teardown
        shell: bash
        run: |
          python scripts/test_source_distribution.py 2>&1 | tee distribution-validation.log
          python scripts/check_source_distribution.py --target "${{ matrix.target }}" \
            --prebuilt "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            2>&1 | tee -a distribution-validation.log
      - name: Upload distribution validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-distribution-${{ matrix.target }}
          path: distribution-validation.log
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Least privilege: read source, write only the evidence artifact.
      contents: read
      actions: write
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the commitlint sensor can inspect recent subjects.
          fetch-depth: 0
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          # The @rev default ignores rust-toolchain.toml; pass the pinned
          # channel so rust-toolchain.toml stays the single source of truth.
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-deny,cargo-audit,cargo-nextest,shellcheck,cargo-machete
      - name: Install actionlint
        # The `actionlint` sensor's script fails closed under CI=true when the
        # tool is missing, and `actionlint` is not in `taiki-e/install-action`'s
        # supported-tool list, so fetch the pinned release tarball and verify its
        # published SHA-256 before putting it on PATH. Bump the version and the
        # digest together (checksums:
        # https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_checksums.txt).
        run: |
          version=1.7.7
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/$archive" \
            | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" \
            --directory "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install linter and doc tooling dependencies
        # One install for every parser the Python-side sensors need, run before
        # the sensors so a missing parser is a hard FAIL under
        # DO_HARNESS_REQUIRE_TOOLS instead of a SKIP: yamllint for workflow/yaml
        # lint, markdown-it-py (scripts/requirements-docs.txt) for docs checks,
        # and PyYAML (.agents/skills/skill-creator/scripts/requirements.txt) for
        # action-pins and eval frontmatter.
        run: |
          python3 -m pip install --disable-pip-version-check yamllint -r .agents/skills/skill-creator/scripts/requirements.txt -r scripts/requirements-docs.txt
          npm install -g markdownlint-cli2
      # Pin maintenance note: agent-governance is pinned to =3.2.2 in workspace dependencies
      # until GA. Upstream renamed this crate to `agentmesh`; the pin stays on the
      # retired 3.2.x line because the live 4.x line is a breaking API change
      # (chore-agt-promotion). Use `cargo update -p agent-governance --precise <ver>`.
      - name: Lint shell sensors
        run: shellcheck scripts/*.sh crates/do-harness/templates/scripts/*.sh
      - name: Build harness CLI
        run: cargo build --release -p do-harness
      - name: Installer end-to-end (checksum, extract, exec)
        run: bash scripts/test-install.sh --bin target/release/do-harness
      - name: Lint and test the npm wrapper
        run: |
          node --check integrations/npm/bin/do-harness.js
          node --check integrations/npm/lib/platform.js
          node --test integrations/npm/test/*.test.mjs
      # actions/cache@v4: the Chromium download is ~150 MB and was the step's
      # slowest avoidable cost, re-fetched on every run. `playwright install`
      # reuses the browser when it is already present.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.50.1
      - name: Browser-test web UI pack
        run: |
          mkdir -p target/web-ui-browser-deps
          npm init -y --prefix target/web-ui-browser-deps >/dev/null
          npm install --prefix target/web-ui-browser-deps --no-save --no-package-lock --no-audit --no-fund playwright@1.50.1
          target/web-ui-browser-deps/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH="$GITHUB_WORKSPACE/target/web-ui-browser-deps/node_modules" node --test integrations/web-ui/audit.browser.test.mjs
      - name: Package npm wrapper (assembly dry run)
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          dist="$(mktemp -d)"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            name="do-harness-v${version}-${target}"
            mkdir -p "$dist/pkg/$name"
            cp target/release/do-harness "$dist/pkg/$name/do-harness"
            tar -czf "$dist/${name}.tar.gz" -C "$dist/pkg" "$name"
          done
          name="do-harness-v${version}-x86_64-pc-windows-msvc"
          mkdir -p "$dist/pkg/$name"
          cp target/release/do-harness "$dist/pkg/$name/do-harness.exe"
          (cd "$dist/pkg" && zip -qr "$dist/${name}.zip" "$name")
          bash scripts/publish-npm.sh --dist "$dist" --dry-run
      - name: Lint and test DSH bundle
        env:
          DO_HARNESS_BIN: ${{ github.workspace }}/target/release/do-harness
        run: |
          node --check integrations/deepseek-harness/index.js integrations/deepseek-harness/lib/*.mjs
          node --test integrations/deepseek-harness/test/*.test.mjs
      # The adjacent crate is covered by the sensors below: `check` compiles it
      # with default features, the `test` sensor's workspace run runs its
      # default-feature suite, and `check-agt`/`check-mcp` build the two feature
      # matrices. Running `cargo check`/`cargo test` here as well charged every
      # pull request for the same three invocations twice (P1).
      - name: Run sensors
        env:
          # check-audit.sh / check-deps.sh / check-shell.sh / check-markdownlint.sh /
          # check-yamllint.sh / check-actionlint.sh fail closed when CI=true;
          # cargo-audit, cargo-deny, shellcheck, actionlint, yamllint,
          # markdownlint-cli2, and the docs tooling are installed above.
          # docs-sync/docs-examples/docs-links run `python3 scripts/docs.py
          # <subcommand> --check`; docs-examples executes the release binary
          # built above, and all three need markdown-it-py, installed just
          # above. check-skills-docs.sh needs markdown-it-py too.
          CI: "true"
          # Belt and braces: missing tools fail even if CI=true is dropped.
          DO_HARNESS_REQUIRE_TOOLS: "1"
        run: ./target/release/do-harness verify --set verification --format json --strict
      - name: Assert verification evidence is green
        run: ./target/release/do-harness status --set verification --format json
      - name: Capture the generated-docs diff
        # `docs-sync` renders every generated block from the Clap definitions and
        # fails on any drift, so the sensor run above has already failed when this
        # step runs. CI never repairs tracked docs (`python3 scripts/docs.py sync
        # --write` refuses while CI is set), so the same read-only check is
        # replayed here and its report — one line per drifted block, naming the
        # first differing line — is kept as a single file for the reviewer. A
        # failure in another sensor leaves the docs in sync, so nothing is
        # uploaded.
        if: failure()
        timeout-minutes: 10
        run: |
          diff_file="$RUNNER_TEMP/docs-sync.diff"
          if python3 scripts/docs.py sync --check > "$diff_file" 2>&1; then
            rm -f "$diff_file"
            exit 0
          fi
          # Bound the uploaded file: the report is one line per drifted block,
          # but a pathological tree must not ship an unbounded log as an
          # artifact.
          tail --bytes=262144 "$diff_file" > "$diff_file.bounded"
          mv "$diff_file.bounded" "$diff_file"
          cat "$diff_file"
          echo "repair locally: python3 scripts/docs.py sync --write"
      # actions/upload-artifact@v7.0.1
      - name: Upload the generated-docs diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-sync-diff
          path: ${{ runner.temp }}/docs-sync.diff
          if-no-files-found: ignore
      # The `scheduled` set (the feature-powerset builds) runs nightly from
      # `.github/workflows/scheduled.yml`, where its evidence is asserted the
      # same way this set's is. Paying a four-build matrix per push and per pull
      # request was the wrong cadence for work that no diff can invalidate
      # (P4).
      - name: Record Cargo.lock hash
        run: |
          mkdir -p .do-harness
          sha256sum Cargo.lock > .do-harness/Cargo.lock.sha256
          cat .do-harness/Cargo.lock.sha256
      - name: Record the DORA snapshot
        # Records the snapshot for this run and asserts the collector's exit
        # contract. Exit 1 is the metric verdict (a threshold breach), not a
        # recording failure: the snapshot row is written either way, and `dora`
        # is report-only by design. Exit 2 (usage/config/discovery) and any
        # other code still fails the job, so a broken collector cannot hide
        # here.
        #
        # This does NOT accumulate history across runs: `.do-harness/` is
        # gitignored local state, and CI neither caches nor uploads
        # `agent_state.db`, so the row lives only for the duration of the job.
        # Durable history means running `dora --record` on a checkout whose
        # state database persists.
        run: |
          code=0
          ./target/release/do-harness dora --record --format json || code=$?
          test "$code" -le 1
      - name: Lint full PR commit range
        # The commitlint sensor only checks COUNT=1 locally; PRs must lint
        # every non-merge commit (fetch-depth: 0 makes both SHAs available).
        if: github.event_name == 'pull_request'
        run: bash scripts/check-commitlint.sh --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Dogfood greenfield rust init + verify
        run: |
          tmp="$(mktemp -d)"
          ./target/release/do-harness --root "$tmp" init
          ./target/release/do-harness --root "$tmp" verify --format json --strict
      - name: Dogfood generic init (vacuous verify, evidenced)
        run: |
          tmp="$(mktemp -d)"
          ./target/release/do-harness --root "$tmp" init --language generic
          ./target/release/do-harness --root "$tmp" verify --format json --strict --evidence "$tmp/.do-harness/evidence.json"
          # The generic pack is empty by design: assert the artifact says so
          # instead of letting a vacuous pass masquerade as a real rust gate.
          test "$(jq -r '.sensor_pack' "$tmp/.do-harness/evidence.json")" = "generic"
      - name: Dogfood node init + verify
        run: |
          tmp="$(mktemp -d)"
          echo '{"name":"dogfood-node","scripts":{"test":"echo ok"}}' > "$tmp/package.json"
          ./target/release/do-harness --root "$tmp" init --language node
          ./target/release/do-harness --root "$tmp" verify --set verification --format json --strict
      - name: Dogfood web init
        run: |
          tmp="$(mktemp -d)"
          ./target/release/do-harness --root "$tmp" init --language web
          test -f "$tmp/scripts/viewport-audit.mjs"
      - name: Dogfood skill eval runner (shebang execution, graded residue)
        run: ./target/release/do-harness eval --strict-fixtures
      - name: Assert evidence integrity
        run: |
          test -f .do-harness/evidence.verification.json
          test -n "$(jq -r '.git_sha // empty' .do-harness/evidence.verification.json)"
          test "$(jq -r '.signal_set' .do-harness/evidence.verification.json)" = "verification"
      # actions/upload-artifact@v7.0.1
      - name: Upload verify evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-evidence
          path: |
            .do-harness/evidence.verification.json
            .do-harness/Cargo.lock.sha256
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve MSRV
        id: msrv
        run: |
          msrv="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          # Installs this toolchain and makes it the rustup default. Commands
          # run inside the checkout still resolve through rust-toolchain.toml
          # unless the step sets RUSTUP_TOOLCHAIN (see the check step below).
          toolchain: ${{ steps.msrv.outputs.msrv }}
          # `init` emits its `fmt` and `clippy` sensors only when the components
          # probe OK, and the dogfood tests assert those sensors are present:
          # a minimal-profile toolchain makes the suite fail for reasons that
          # have nothing to do with the MSRV.
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: msrv
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          # Same reason: `init` emits its `test` sensor only when
          # `cargo nextest --version` probes OK (src/init/detect.rs).
          tool: cargo-nextest
      - name: Check workspace on MSRV
        # rust-toolchain.toml pins the dev channel and wins over an installed
        # toolchain, so every step that must use the MSRV selects it explicitly.
        # Cargo's `rust-version` check only errors when the *selected* toolchain
        # is older than the declared minimum (`--ignore-rust-version` bypasses
        # it), so compiling with the pinned channel proves nothing about
        # compatibility with 1.85 — five let-chains reached main that way. This
        # step is source compatibility for every target (default features),
        # including test code.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace on MSRV
        # The Cargo Book's "Verified" support expectation is "a package's
        # functionality is verified on its supported Rust versions, including
        # automated testing" (cargo/reference/rust-version.html): a type check
        # is not that, so the suite runs here on the declared minimum.
        #
        # `CI` is cleared for this step on purpose. GitHub sets CI=true for every
        # job, and the scaffolded packs' deps/audit sensors fail closed when
        # CI=true without cargo-deny/cargo-audit — tools this job does not
        # install, so `init`'s baseline proof would fail on 1.85 for reasons that
        # have nothing to do with the MSRV. CI-mode expectations are covered by
        # the verify job (tools installed, CI=true) and the windows job; this
        # step runs exactly what a maintainer runs locally.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}
          CI: ""
        run: cargo test --workspace --locked
      - name: Test guardian-proxy with its MSRV-clean feature on MSRV
        # Scope: `cargo test --workspace` builds each package with its default
        # features, and `guardian-proxy` ships `default = []`. `agt-governance`
        # is MSRV-clean (measured on 1.85), so it is verified here too.
        #
        # `mcp-surface` is deliberately absent: it pulls rmcp, whose every 3.x
        # release requires Rust 1.88, so the workspace declares 1.85 only while
        # that feature is off (crates/guardian-proxy/Cargo.toml, and
        # plans/mcp-conformance-epic.md). The verify job exercises that feature
        # on the stable toolchain; this job cannot, and the exclusion is a
        # recorded decision rather than an oversight.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.msrv }}
          CI: ""
        run: cargo test -p guardian-proxy --features agt-governance --locked

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: windows
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-deny,cargo-audit,cargo-nextest
      # The full `cargo test --workspace` also runs on ubuntu (verify job);
      # running it here too is what makes Windows a supported platform rather
      # than a build-only target. POSIX-only tests are `#[cfg(unix)]`-gated
      # (eval walkthrough shebangs, hook exit codes, file-mode helpers) and the
      # runners provide Git Bash, so `sh`/`bash` sensors work as written.
      - name: Install skill tooling dependencies
        # quick_validate.py and action-pins parse YAML frontmatter and need
        # PyYAML. Ubuntu images ship it; windows-latest does not, so install it.
        run: python -m pip install --disable-pip-version-check -r .agents/skills/skill-creator/scripts/requirements.txt
      - name: Install pnpm for the node init tests
        # `init::tests::init_node_pnpm_turbo_workspace_first_run_is_green`
        # declares a pnpm workspace, so its baseline can only go Green when
        # pnpm is the resolved package manager. windows-latest ships npm/yarn
        # but not pnpm, so provide it rather than letting the fixture run under
        # a package manager it does not describe.
        run: npm install --global pnpm@10
      - name: Test workspace on Windows
        # Bounded so a hung test fails in minutes rather than consuming the
        # job's full 30-minute budget with no output. `nextest` runs each test
        # in an isolated process to prevent libSQL/SQLite multithreaded teardown
        # access violations (0xc0000005) on Windows MSVC.
        timeout-minutes: 12
        run: cargo nextest run --workspace --release --exclude do-harness-db
      - name: Test do-harness-db on Windows
        # The db tests each open their own temporary libSQL database. On
        # Windows that binary crashed once with STATUS_ACCESS_VIOLATION
        # (0xc0000005) after every test had reported `ok`, and the same code
        # passed on the next commit, so it is intermittent rather than a
        # deterministic failure. Serializing this crate is a cheap mitigation
        # (the suite runs in seconds) that keeps the signal without masking a
        # reproducible failure: any real test failure still fails the step.
        timeout-minutes: 8
        run: cargo test -p do-harness-db --release -- --test-threads=1
      - name: Build harness CLI
        run: cargo build --release -p do-harness
      - name: Dogfood init + verify with the release binary
        shell: bash
        env:
          # The generated pack's deps/audit sensors fail closed under CI=true;
          # cargo-deny and cargo-audit are installed above.
          CI: "true"
          DO_HARNESS_REQUIRE_TOOLS: "1"
        run: |
          tmp="$(mktemp -d)"
          ./target/release/do-harness.exe --root "$tmp" init
          ./target/release/do-harness.exe --root "$tmp" verify --format json --strict
      - name: Test the installer (including the windows zip path)
        shell: bash
        run: bash scripts/test-install.sh --bin ./target/release/do-harness.exe
      - name: Prove hook install + status and doctor on Windows
        shell: bash
        run: |
          scratch="$(mktemp -d)"
          git init -q "$scratch"
          # Seed one commit: the scaffolded commitlint sensor inspects the last
          # commit and fails in a repository with no commits, which makes init's
          # initial verification legitimately RED (exit 1).
          git -C "$scratch" -c user.email=ci@example.com -c user.name=ci \
            commit -q --allow-empty -m "chore: seed"
          ./target/release/do-harness.exe --root "$scratch" init
          bin="$PWD/target/release/do-harness.exe"
          cd "$scratch"
          DO_HARNESS_BIN="$bin" "$bin" hook install
          DO_HARNESS_BIN="$bin" "$bin" hook status
          DO_HARNESS_BIN="$bin" "$bin" doctor
      - name: Lint and test the npm wrapper
        shell: bash
        run: |
          node --check integrations/npm/bin/do-harness.js
          node --check integrations/npm/lib/platform.js
          node --test integrations/npm/test/*.test.mjs
