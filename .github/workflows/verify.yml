name: verify
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Least privilege: read source, write only the evidence artifact.
      contents: read
      actions: write
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history so the commitlint sensor can inspect recent subjects.
          fetch-depth: 0
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          # The @rev default ignores rust-toolchain.toml; pass the pinned
          # channel so rust-toolchain.toml stays the single source of truth.
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          tool: cargo-deny,cargo-audit
      # Pin maintenance note: agent-governance is pinned to =3.2.2 in workspace dependencies
      # until GA. Use `cargo update -p agent-governance --precise <ver>` for updates.
      - name: Lint shell sensors
        run: shellcheck scripts/*.sh crates/do-harness/templates/scripts/*.sh
      - name: Build harness CLI
        run: cargo build --release -p do-harness
      - name: Check adjacent guardian-proxy crate
        run: cargo check -p guardian-proxy && cargo check -p guardian-proxy --features agt-governance
      - name: Test adjacent guardian-proxy crate
        run: cargo test -p guardian-proxy
      - name: Run sensors
        env:
          # check-audit.sh / check-deps.sh / check-shell.sh fail closed when
          # CI=true; cargo-audit and cargo-deny are installed above.
          CI: "true"
          # Belt and braces: missing tools fail even if CI=true is dropped.
          DO_HARNESS_REQUIRE_TOOLS: "1"
        run: ./target/release/do-harness verify --set verification --format json --strict
      - name: Assert verification evidence is green
        run: ./target/release/do-harness status --set verification --format json
      - name: Record Cargo.lock hash
        run: |
          mkdir -p .do-harness
          sha256sum Cargo.lock > .do-harness/Cargo.lock.sha256
          cat .do-harness/Cargo.lock.sha256
      - name: Lint full PR commit range
        # The commitlint sensor only checks COUNT=1 locally; PRs must lint
        # every non-merge commit (fetch-depth: 0 makes both SHAs available).
        if: github.event_name == 'pull_request'
        run: bash scripts/check-commitlint.sh --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Dogfood greenfield rust init + verify
        run: |
          tmp="$(mktemp -d)"
          ./target/release/do-harness --root "$tmp" init
          ./target/release/do-harness --root "$tmp" verify --format json --strict
      - name: Dogfood generic init (vacuous verify, evidenced)
        run: |
          tmp="$(mktemp -d)"
          ./target/release/do-harness --root "$tmp" init --language generic
          ./target/release/do-harness --root "$tmp" verify --format json --strict --evidence "$tmp/.do-harness/evidence.json"
          # The generic pack is empty by design: assert the artifact says so
          # instead of letting a vacuous pass masquerade as a real rust gate.
          test "$(jq -r '.sensor_pack' "$tmp/.do-harness/evidence.json")" = "generic"
      - name: Dogfood skill eval runner (shebang execution, graded residue)
        run: ./target/release/do-harness eval
      - name: Assert evidence integrity
        run: |
          test -f .do-harness/evidence.verification.json
          test -n "$(jq -r '.git_sha // empty' .do-harness/evidence.verification.json)"
          test "$(jq -r '.signal_set' .do-harness/evidence.verification.json)" = "verification"
      # actions/upload-artifact@v4 (v4.6.2)
      - name: Upload verify evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-evidence
          path: |
            .do-harness/evidence.verification.json
            .do-harness/Cargo.lock.sha256
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve MSRV
        id: msrv
        run: |
          msrv="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          # Explicit input overrides any local rust-toolchain.toml pin.
          toolchain: ${{ steps.msrv.outputs.msrv }}
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: msrv
      - name: Check workspace on MSRV
        run: cargo check --workspace --locked

  dsh-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # No push/fetch credentials persisted: this workflow never pushes.
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build harness CLI for the bundle tests
        run: cargo build --release -p do-harness
      - name: Lint DSH bundle JavaScript
        run: node --check integrations/deepseek-harness/index.js integrations/deepseek-harness/lib/*.mjs
      - name: Test DSH bundle (unit + real-binary e2e)
        env:
          DO_HARNESS_BIN: ${{ github.workspace }}/target/release/do-harness
        run: node --test integrations/deepseek-harness/test/*.test.mjs
