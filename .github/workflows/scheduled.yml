name: scheduled

# The `scheduled` signal set is work that is real but too expensive to charge to
# every push and pull request: `powerset` builds guardian-proxy across its
# feature combinations. It used to run inside the `verify` workflow, so a
# four-build matrix was paid per push; it now runs nightly, and its evidence is
# asserted the same way the `verification` set's is.

on:
  schedule:
    # Nightly, off the hour so it does not queue behind the hourly jobs.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Keep the aggregate compiler RSS bounded, as in `verify.yml`. The feature
# matrix is the build most likely to hit a small runner's memory ceiling.
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scheduled:
    # Pinned rather than `ubuntu-latest`: the label migrates to Ubuntu 26.04
    # over the weeks from 2026-10-19 and the documented mitigation is to pin
    # the image (https://github.com/actions/runner-images/issues/14748). The
    # instrumented run is the part most sensitive to a system-library change.
    runs-on: ubuntu-24.04
    # `powerset` builds four feature combinations and `coverage` runs the whole
    # suite under instrumentation; both are heavy, which is why they are here
    # rather than on every pull request.
    timeout-minutes: 45
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain@master (SHA within master history per action docs)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # taiki-e/install-action@v2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518
        with:
          # cargo-hack for `powerset`; cargo-machete for `machete`; cargo-llvm-cov
          # and cargo-nextest for `coverage` (which runs `cargo llvm-cov nextest`);
          # cargo-deny and cargo-audit for scaffolded test workspace verification.
          # All fail closed in this job (`CI=true`, `DO_HARNESS_REQUIRE_TOOLS=1`),
          # so a missing tool must not read as a skip.
          tool: cargo-deny,cargo-audit,cargo-hack,cargo-machete,cargo-llvm-cov,cargo-nextest
      - name: Build harness CLI
        run: cargo build --release -p do-harness
      - name: Add swap headroom for the instrumented run
        # A hosted runner has 16 GB RAM and a 14 GB SSD
        # (https://docs.github.com/en/actions/reference/runners/github-hosted-runners).
        # `coverage` instruments and re-runs the whole suite; once the coverage
        # fixes let the suite run deeper, the runner was shut down with a
        # shutdown signal a few minutes in. 4 GB of swap on the ephemeral disk
        # turns such a spike into paging, and the caps on the verify step below
        # bound the peak in the first place. `dd` rather than `fallocate`:
        # swapon(8) warns that preallocated files can be treated as holes
        # depending on the filesystem and calls dd from /dev/zero the most
        # portable solution.
        run: |
          swapfile=/mnt/do-harness-swapfile
          sudo dd if=/dev/zero of="$swapfile" bs=1M count=4096 status=none
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile" >/dev/null
          sudo swapon "$swapfile"
          free -m
      - name: Run scheduled sensors
        env:
          # `check-powerset.sh` fails closed when CI=true and a missing
          # cargo-hack must not pass as a SKIP.
          CI: "true"
          DO_HARNESS_REQUIRE_TOOLS: "1"
          # `coverage` is the heaviest sensor in the repository. One compiler
          # (CARGO_BUILD_JOBS, Cargo's "number of parallel jobs") and one test
          # (NEXTEST_TEST_THREADS, nextest's "number of tests to run
          # simultaneously") at a time keep the peak inside the runner's RAM;
          # the swap above absorbs the rest.
          CARGO_BUILD_JOBS: "1"
          NEXTEST_TEST_THREADS: "1"
        run: ./target/release/do-harness verify --set scheduled --format json --strict
      - name: Assert scheduled evidence is green
        run: ./target/release/do-harness status --set scheduled --format json
      - name: Report resource state when the gate fails
        # A killed runner reports only exit 143 and a shutdown signal. Record
        # memory, swap, and disk before the log is lost so the next failure
        # names the exhausted resource instead of guessing.
        if: failure()
        run: |
          free -m || true
          swapon --show || true
          df -h || true
          du -sh target 2>/dev/null || true
          sudo dmesg --ctime | tail -n 40 || true
