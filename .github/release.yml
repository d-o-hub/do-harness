# Configuration for GitHub's generated changelog.
#
# `scripts/release-notes.sh compose` keeps only the generated bullet list and its
# "Full Changelog" trailer, then groups the bullets by the conventional-commit
# type in each pull-request title. Labels are deliberately not the grouping: no
# pull request in this repository carries one (0 of 74 merged between v0.1.1 and
# v0.1.2), so the label categories produced a single catch-all bucket. The
# category below is the generator's own fallback and is not the published
# grouping; see docs/releasing.md ("Release notes").
#
# `exclude` still applies before the bullets reach the composer.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - question
      - wontfix
  categories:
    - title: Changes
      labels:
        - "*"
