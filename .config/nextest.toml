[profile.default]
retries = 0
# Bounded test threads: full-suite instrumented runs (llvm-cov) pile up
# spawning integration tests past small-box memory (measured 2026-10-14:
# 8-wide instrumented runaway past 11GB anon on a 14GB host); 2 keeps the
# default suite green locally with a small CI slowdown.
test-threads = 2
# No `no-tests` key here: nextest reports it as an unknown configuration key,
# and this repository's harness deliberately does NOT pass `--no-tests=pass`, so
# a run that executes zero tests fails the `test` sensor instead of reporting
# green (`tests/vacuous_gates.rs` pins that).

[profile.ci]
retries = 1
slow-timeout = { period = "60s", terminate-after = 3 }
