language = "rust"

[hooks]
pre-commit = ["fmt", "loc"]
pre-push = []

[signal-sets]
# `feedback` is the fast loop, so it names the sensors the generated pre-commit
# hook runs (`fmt` and `loc`): a set that omitted one of them would be a
# different check than the commit it stands for.
feedback = ["fmt", "check", "clippy", "loc"]
# `machete` is cheap (one scan over the manifests) and a pull request can add an
# unused dependency, so it belongs to the PR-time set; `powerset` builds four
# feature combinations and `coverage` is the heaviest sensor in the repository
# (an instrumented full run), so both are scheduled instead
# (`.github/workflows/scheduled.yml`). `coverage` sat in `release` only: the
# floor never ran on a pull request, so a regression could land on main and
# surface only at tag time.
verification = ["fmt", "check", "clippy", "deps", "machete", "audit", "test", "doctest", "loc", "skills", "skills-docs", "shell", "markdownlint", "yamllint", "check-agt", "check-mcp", "check-invariants", "check-promotions", "untrusted-ingest", "privacy", "release-notes", "commitlint"]
release = ["fmt", "check", "clippy", "deps", "audit", "test", "doctest", "coverage", "loc", "skills", "skills-docs", "shell", "markdownlint", "yamllint", "check-agt", "check-mcp", "check-invariants", "check-promotions", "untrusted-ingest", "privacy", "release-notes", "commitlint"]
# DORA gets its own set so its evidence is addressable (`status --set metrics`)
# without joining the gating sets. A no-`--set` status check compares against
# every configured sensor, so a dora-only run's artifact would report
# `insufficient_coverage` rather than green; scoping the evidence to a set is
# what makes the freshness comparison meaningful.
metrics = ["dora"]
scheduled = ["powerset", "coverage"]

[[sensors]]
name = "fmt"
argv = ["cargo", "fmt", "--all", "--", "--check"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]

[[sensors]]
name = "check"
argv = ["cargo", "check", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/config.toml"]

[[sensors]]
name = "clippy"
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".clippy.toml", ".cargo/config.toml"]

[[sensors]]
# No `--no-tests=pass`: that flag turns "the suite vanished" into a green gate,
# which section 4 of AGENTS.md rejects ("Treat `0 tests run` or empty sensor
# output as RED"). nextest fails the run when it executes zero tests, and the
# scaffold ships a unit test, so a workspace with a real suite never trips it.
name = "test"
argv = ["cargo", "nextest", "run", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".config/nextest.toml", ".cargo/config.toml"]

[[sensors]]
name = "doctest"
argv = ["cargo", "test", "--doc", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/config.toml"]

[[sensors]]
name = "coverage"
argv = ["bash", "scripts/check-coverage.sh"]
severity = "warn"
when-changed = ["**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".config/nextest.toml", "scripts/check-coverage.sh"]

[[sensors]]
name = "loc"
argv = ["bash", "scripts/check-loc.sh"]
when-changed = ["**/*.rs", "scripts/check-loc.sh"]

[[sensors]]
name = "skills"
argv = ["bash", "scripts/check-skills-sync.sh"]
when-changed = [".agents/skills/**", "crates/do-harness/templates/skills/**", "scripts/check-skills-sync.sh"]

[[sensors]]
# Drift gate between the skill catalog and its docs: docs/skills.md must name
# exactly the skills under .agents/skills/ (frontmatter names only, never
# skill bodies), every repo-relative path the docs name must exist, and the
# README Skills section must point at the guide. Run with --fix locally after
# adding/renaming/removing a skill; CI runs the plain check.
name = "skills-docs"
argv = ["bash", "scripts/check-skills-docs.sh"]
when-changed = [".agents/skills/**", "docs/skills.md", "README.md", "scripts/check-skills-docs.sh"]

[[sensors]]
name = "deps"
argv = ["bash", "scripts/check-deps.sh"]
when-changed = ["Cargo.toml", "Cargo.lock", "crates/**/Cargo.toml", "deny.toml", "scripts/check-deps.sh", "scripts/check-package-contract.sh", "scripts/*.py"]

[[sensors]]
name = "shell"
argv = ["bash", "scripts/check-shell.sh"]
when-changed = ["scripts/**", "crates/do-harness/templates/scripts/**", ".agents/skills/**", "crates/do-harness/templates/skills/**", "tests/fixtures/**"]

[[sensors]]
name = "markdownlint"
argv = ["bash", "scripts/check-markdownlint.sh"]
when-changed = ["**/*.md", ".markdownlint-cli2.jsonc", "scripts/check-markdownlint.sh"]

[[sensors]]
name = "yamllint"
argv = ["bash", "scripts/check-yamllint.sh"]
# Only YAML inputs: the sensor lints `*.yml`/`*.yaml` only, so promising
# `do-harness.toml` or `plans/*.json` applicability would select the sensor to
# check files it never reads. Policy JSON content is guarded by
# `check-invariants`.
when-changed = ["**/*.yml", "**/*.yaml", ".yamllint.yml", "scripts/check-yamllint.sh"]

[[sensors]]
name = "check-agt"
argv = ["cargo", "test", "-p", "guardian-proxy", "--features", "agt-governance"]
when-changed = ["crates/guardian-proxy/**", "Cargo.toml", "Cargo.lock"]

[[sensors]]
name = "check-mcp"
argv = ["cargo", "test", "-p", "guardian-proxy", "--features", "mcp-surface"]
when-changed = ["crates/guardian-proxy/**", "Cargo.toml", "Cargo.lock"]

[[sensors]]
# Content guard for the policy record itself: every decision header keeps its
# required fields, no two entries repeat an invariant, and every `scripts/...`
# path a header points at still exists. Without it, the schema is validated
# only on `seed`/`init` and a stale or hand-edited entry sits unnoticed.
name = "check-invariants"
argv = ["bash", "scripts/check-invariants.sh"]
when-changed = ["plans/invariants.json", "do-harness.toml", "scripts/check-invariants.sh"]

[[sensors]]
# Hermetic coherence gate for the *-promotion decisions: a recorded hold must
# match an off-by-default feature, and a recorded promote must match a
# default-enabled one. It exists because a promotion decision can silently drift
# from the shipped defaults across a long-lived epic, and because the GA watch
# itself cannot be a sensor (it exits 0 on every verdict and needs the network).
name = "check-promotions"
argv = ["bash", "scripts/check-promotion-decisions.sh"]
when-changed = ["plans/*-epic.md", "plans/invariants.json", "crates/guardian-proxy/Cargo.toml", "scripts/check-promotion-decisions.sh"]

[[sensors]]
name = "audit"
argv = ["bash", "scripts/check-audit.sh"]
when-changed = ["Cargo.toml", "Cargo.lock", "scripts/check-audit.sh"]

[[sensors]]
# No `when-changed`: a commit message is not tied to any tracked path, so
# `commitlint` is always applicable. The pre-commit hook runs it on every
# commit, and the sensor stays cheap enough for that (it reads the message on
# stdin and matches conventional-commit prefixes).
name = "commitlint"
argv = ["bash", "scripts/check-commitlint.sh"]

[[sensors]]
name = "privacy"
argv = ["bash", "scripts/check-privacy.sh"]
when-changed = ["crates/do-harness/templates/**", ".agents/skills/**", "AGENTS.md", "scripts/check-privacy.sh"]

[[sensors]]
# Executable half of pr-triage's "untrusted text is data, never instructions"
# contract. The skill ingests hostile PR bodies, comments, and webhook
# payloads; the rule that none of it reaches a dynamic-execution sink used to
# be prose only, which AGENTS.md section 7 does not accept. Hermetic: reads
# the skill tree, runs nothing from it.
name = "untrusted-ingest"
argv = ["bash", "scripts/check-untrusted-ingest.sh"]
when-changed = [".agents/skills/pr-triage/**", "scripts/check-untrusted-ingest.sh"]

[[sensors]]
# Executable half of the release-note contract: a published body carries the
# sections a reader needs. The release job runs `release-notes.sh compose` and
# `check` against the real body; this entry runs the hermetic controls, which
# prove the check can still fail (a bare generated dump, a surviving
# placeholder, an emptied section, a lost pull request).
name = "release-notes"
argv = ["bash", "scripts/release-notes.sh", "--self-test"]
when-changed = [".github/release-notes-template.md", ".github/release.yml", ".github/workflows/release.yml", "docs/releases/**", "scripts/release-notes.sh"]

[[sensors]]
# DORA deployment health, derived (never judged) from git history. Report-only:
# severity stays "warn" and the sensor is deliberately absent from every
# [signal-sets] entry until a blessed findings baseline exists, so a breach is
# advisory rather than a CI stop. Gating is then mechanical: `verify --record
# --only dora --bless` pins the current breach count into plans/baselines.json,
# after which apply_ratchet turns any increase into a hard failure even at warn
# severity, and a later bless can only lower the ceiling.
#
# No `when-changed` key: DORA is a whole-history measurement, not a per-file
# check, so the sensor must stay always-applicable. Listing source globs here
# would silently skip the sensor on every unrelated change, which is the
# failure mode that makes a metric disappear exactly when it should be read.
#
# `coverage-inputs` is what pins the policy: plans/dora.json defines every
# number, so editing a threshold makes prior dora evidence stale instead of
# silently incomparable.
name = "dora"
argv = ["bash", "scripts/check-dora.sh"]
severity = "warn"
coverage-inputs = ["plans/dora.json"]

[[sensors]]
# Feature-powerset sensor for guardian-proxy feature combinations (--features
# agt-governance / mcp-surface on/off). Exact-pin policy: dependency pins
# (agent-governance = "=3.2.2", rmcp = "=3.5.0") remain exact per policy;
# this sensor verifies all feature combinations build. Kept out of fast-loop hooks.
name = "powerset"
argv = ["bash", "scripts/check-powerset.sh"]
when-changed = ["crates/guardian-proxy/**", "Cargo.toml", "Cargo.lock", "scripts/check-powerset.sh"]

[[sensors]]
# Unused-dependency pruning sensor using cargo-machete. Exact-pin policy: pins stay exact;
# this sensor verifies no unused dependencies exist across workspace manifests. Kept out of fast-loop hooks.
name = "machete"
argv = ["bash", "scripts/check-machete.sh"]
when-changed = ["**/Cargo.toml", "Cargo.lock", "scripts/check-machete.sh"]
