language = "rust"

[hooks]
pre-commit = ["fmt", "loc"]
# Bounded to ordinary checks (matching signal-sets.verification) so heavy
# scheduled checks (`coverage`, `powerset`) and release preflights never execute on local push.
pre-push = ["fmt", "check", "clippy", "deps", "machete", "audit", "test", "doctest", "loc", "skills", "skills-docs", "shell", "markdownlint", "docs-sync", "docs-examples", "docs-links", "yamllint", "actionlint", "action-pins", "check-agt", "check-mcp", "check-invariants", "check-promotions", "untrusted-ingest", "privacy", "release-notes", "release-manager", "verify-published", "commitlint", "ci-concurrency-guardrails", "workflow-benchmark", "ci-workflow-costs", "repo-links", "latest-main-guardrails"]

[signal-sets]
# `feedback` is the fast loop, so it names the sensors the generated pre-commit
# hook runs (`fmt` and `loc`): a set that omitted one of them would be a
# different check than the commit it stands for.
feedback = ["fmt", "check", "clippy", "loc"]
# `machete` is cheap (one scan over the manifests) and a pull request can add an
# unused dependency, so it belongs to the PR-time set; `powerset` builds four
# feature combinations and `coverage` is the heaviest sensor in the repository
# (an instrumented full run), so both are scheduled instead
# (`.github/workflows/scheduled.yml`). `coverage` sat in `release` only: the
# floor never ran on a pull request, so a regression could land on main and
# surface only at tag time.
# The `docs-sync`/`docs-examples`/`docs-links` trio enforces the documentation
# contract (`docs/documentation-contract.md`). Each one reads only git, the
# working tree, and the local toolchain, and each fails closed on an empty
# inventory, so the trio belongs to the PR-time set as well as `release`.
verification = ["fmt", "check", "clippy", "deps", "machete", "audit", "test", "doctest", "loc", "skills", "skills-docs", "shell", "markdownlint", "docs-sync", "docs-examples", "docs-links", "yamllint", "actionlint", "action-pins", "check-agt", "check-mcp", "check-invariants", "check-promotions", "untrusted-ingest", "privacy", "release-notes", "release-manager", "verify-published", "commitlint", "ci-concurrency-guardrails", "workflow-benchmark", "ci-workflow-costs", "repo-links", "latest-main-guardrails"]
release = ["fmt", "check", "clippy", "deps", "audit", "test", "doctest", "coverage", "loc", "skills", "skills-docs", "shell", "markdownlint", "docs-sync", "docs-examples", "docs-links", "yamllint", "actionlint", "action-pins", "check-agt", "check-mcp", "check-invariants", "check-promotions", "untrusted-ingest", "privacy", "release-notes", "release-manager", "release-manager-e2e", "publish-npm", "verify-published", "commitlint", "ci-concurrency-guardrails", "workflow-benchmark", "ci-workflow-costs", "repo-links", "latest-main-guardrails"]
# DORA gets its own set so its evidence is addressable (`status --set metrics`)
# without joining the gating sets. A no-`--set` status check compares against
# every configured sensor, so a dora-only run's artifact would report
# `insufficient_coverage` rather than green; scoping the evidence to a set is
# what makes the freshness comparison meaningful.
metrics = ["dora"]
scheduled = ["powerset", "coverage"]

[[sensors]]
name = "fmt"
argv = ["cargo", "fmt", "--all", "--", "--check"]
when-changed = ["**/*.rs", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]

[[sensors]]
name = "check"
argv = ["cargo", "check", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/config.toml"]

[[sensors]]
name = "clippy"
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
when-changed = ["**/*.rs", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".clippy.toml", ".cargo/config.toml"]

[[sensors]]
# No `--no-tests=pass`: that flag turns "the suite vanished" into a green gate,
# which section 4 of AGENTS.md rejects ("Treat `0 tests run` or empty sensor
# output as RED"). nextest fails the run when it executes zero tests, and the
# scaffold ships a unit test, so a workspace with a real suite never trips it.
name = "test"
argv = ["cargo", "nextest", "run", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".config/nextest.toml", ".cargo/config.toml"]

[[sensors]]
name = "doctest"
argv = ["cargo", "test", "--doc", "--workspace"]
when-changed = ["**/*.rs", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/config.toml"]

[[sensors]]
name = "coverage"
argv = ["bash", "scripts/check-coverage.sh"]
severity = "warn"
when-changed = ["**/*.rs", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".config/nextest.toml", "scripts/check-coverage.sh"]

[[sensors]]
name = "loc"
argv = ["bash", "scripts/check-loc.sh"]
when-changed = ["**/*.rs", "scripts/check-loc.sh", "scripts/lib.sh"]

[[sensors]]
name = "skills"
argv = ["bash", "scripts/check-skills-sync.sh"]
when-changed = [".agents/skills/**", "crates/do-harness/templates/skills/**", "scripts/check-skills-sync.sh", "scripts/lib.sh"]

[[sensors]]
# Drift gate between the skill catalog and its docs: docs/skills.md must name
# exactly the skills under .agents/skills/ (frontmatter names only, never
# skill bodies), every repo-relative path the docs name must exist, and the
# README Skills section must point at the guide. Run with --fix locally after
# adding/renaming/removing a skill; CI runs the plain check.
name = "skills-docs"
argv = ["bash", "scripts/check-skills-docs.sh"]
when-changed = [
    ".agents/skills/**",
    "docs/**",
    "**/*.md",
    "README.md",
    "AGENTS.md",
    "SECURITY.md",
    "**/README.md",
    "crates/do-harness/src/**",
    "crates/do-harness/templates/**",
    "crates/**/Cargo.toml",
    "crates/**/build.rs",
    "Cargo.toml",
    "Cargo.lock",
    ".cargo/**",
    "rust-toolchain.toml",
    "do-harness.toml",
    ".github/workflows/**",
    "scripts/check-skills-docs.sh",
    "scripts/docs.py",
    "scripts/docs-review-benchmark.py",
    "scripts/doc_tools/**",
    "scripts/test_doc_tools.py",
    "scripts/tests/**",
    "tests/fixtures/cli-contract.json",
    "tests/fixtures/doc_tools/**",
    "tests/fixtures/docs-examples/**",
    "scripts/requirements-docs.txt",
    "scripts/lib.sh",
]

[[sensors]]
name = "deps"
argv = ["bash", "scripts/check-deps.sh"]
when-changed = ["Cargo.toml", "Cargo.lock", "crates/**/Cargo.toml", "deny.toml", "scripts/check-deps.sh", "scripts/check-package-contract.sh", "scripts/*.py", "scripts/lib.sh"]

[[sensors]]
name = "shell"
argv = ["bash", "scripts/check-shell.sh"]
when-changed = ["scripts/**", "crates/do-harness/templates/scripts/**", ".agents/skills/**", "crates/do-harness/templates/skills/**", "tests/**"]

[[sensors]]
name = "markdownlint"
argv = ["bash", "scripts/check-markdownlint.sh"]
when-changed = ["**/*.md", ".markdownlint-cli2.jsonc", "scripts/check-markdownlint.sh", "scripts/lib.sh"]

[[sensors]]
name = "yamllint"
argv = ["bash", "scripts/check-yamllint.sh"]
# Only YAML inputs: the sensor lints `*.yml`/`*.yaml` only, so promising
# `do-harness.toml` or `plans/*.json` applicability would select the sensor to
# check files it never reads. Policy JSON content is guarded by
# `check-invariants`.
when-changed = ["**/*.yml", "**/*.yaml", ".yamllint.yml", "scripts/check-yamllint.sh", "scripts/lib.sh"]

[[sensors]]
# Schema/lint gate for GitHub Actions workflows. yamllint proves the files are
# well-formed YAML but cannot see a misspelled key, an undefined
# `${{ matrix.foo }}`, a bad action input, or a shell syntax error inside a
# `run:` step; actionlint parses the workflow schema plus the embedded shell.
# actionlint is not part of a default dev checkout's toolset, so the SKIP/FAIL
# policy keeps the local gate usable while CI (`verify.yml`) and the release
# preflight (`release.yml`) install the pinned 1.7.7 binary.
name = "actionlint"
argv = ["bash", "scripts/check-actionlint.sh"]
when-changed = [".github/workflows/**", "scripts/check-actionlint.sh", "scripts/lib.sh"]

[[sensors]]
# Immutable-reference gate for GitHub Actions. actionlint proves the workflow
# is syntactically valid; it cannot see that `owner/repo@v4` is a mutable tag
# that can move without a diff in this repository. This sensor requires a
# full 40-character commit SHA for every external action and reusable
# workflow, and a sha256 digest for every Docker action image. It is offline:
# it never calls the GitHub API and never resolves a tag, so it proves the
# shape of a reference, not that the commit exists. The parser is PyYAML,
# installed by CI from `.agents/skills/skill-creator/scripts/requirements.txt`;
# a missing parser follows the same SKIP-locally/FAIL-when-required policy as
# a missing interpreter.
name = "action-pins"
argv = ["bash", "scripts/check-action-pins.sh"]
when-changed = [
    ".github/workflows/**",
    "scripts/check-action-pins.sh",
    "scripts/check-action-pins.py",
    "scripts/action_pins/**",
    "crates/do-harness/tests/action_pins.rs",
    "crates/do-harness/tests/action_pins/**",
    "crates/do-harness/tests/ci_parity.rs",
    "crates/do-harness/tests/ci_parity/**",
    ".agents/skills/skill-creator/scripts/requirements.txt",
    "do-harness.toml",
    "scripts/lib.sh",
]

[[sensors]]
# Generated-block drift gate. The `cli-commands` region of `README.md`, the
# `cli-globals` and `cli-contract <path>` regions of `docs/cli.md`, and the
# whole `tests/fixtures/cli-contract.json` are rendered from the Clap
# definitions (`crates/do-harness/src/docs_generation`), so renaming a
# command, moving a flag, or editing help text leaves the committed blocks
# stale. `--check` compares every region byte-for-byte (newline-normalized) and
# fails naming the file and region; the repair is `--write`, which is refused
# while `CI` is set and never inserts or deletes a marker pair by itself.
name = "docs-sync"
argv = ["python3", "scripts/docs.py", "sync", "--check"]
fix = "python3 scripts/docs.py sync --write"
when-changed = ["README.md", "docs/cli.md", "tests/fixtures/cli-contract.json", "**/*.rs", "Cargo.toml", "Cargo.lock", "scripts/docs.py", "scripts/doc_tools/**", "scripts/requirements-docs.txt", "scripts/test_doc_tools.py", "scripts/tests/**", "tests/fixtures/doc_tools/**", "do-harness.toml", ".github/workflows/verify.yml", ".github/workflows/release.yml"]

[[sensors]]
# Executable documentation gate. Every `<!-- example: id=<id> classification=... -->`
# block in a maintained document must run against its fixture in
# `tests/fixtures/docs-examples/manifest.toml` (or parse, for
# `parser-check-only`), and an unmarked CLI/config fence is itself a failure,
# so a documented command that no longer runs, a stale `displayed_command`, or
# a new fence without a marker fires here. `**/*.md` covers every maintained
# document the checker reads, canonical alias symlinks included
# (`crates/do-harness/README.md` → `README.md`,
# `crates/do-harness/assets/compliance.md` → `docs/compliance.md`); the
# `**/*.rs`/`Cargo.*` inputs are there because the checker runs the real
# `do-harness` binary it may have to build.
name = "docs-examples"
argv = ["python3", "scripts/docs.py", "examples", "--check"]
fix = "repair the failing documented example named in the check output"
when-changed = ["**/*.md", "docs/contracts.toml", "tests/fixtures/docs-examples/**", "scripts/test-install.sh", "crates/do-harness/templates/**", "**/*.rs", "Cargo.toml", "Cargo.lock", "scripts/docs.py", "scripts/doc_tools/**", "scripts/requirements-docs.txt", "scripts/test_doc_tools.py", "scripts/tests/**", "tests/fixtures/doc_tools/**", "do-harness.toml", ".github/workflows/verify.yml", ".github/workflows/release.yml"]

[[sensors]]
# Link and anchor integrity for maintained documents. `markdownlint` checks
# structure, not whether a documented `../crates/types` or `scripts/*.sh` path
# still exists, and it never checks `#anchor` targets, so a rename turns a cited
# path into a dead link and a renamed heading into a dead anchor silently. The
# checked set is the `docs/contracts.toml` inventory (maintained documents plus
# canonical alias symlinks — `**/*.md` covers that surface whole); historical,
# fixture, and vendored documents are deliberately exempt, and the scan is git
# and filesystem only (no network), which is why it can gate a pull request.
name = "docs-links"
argv = ["python3", "scripts/docs.py", "links", "--check"]
fix = "repair the broken path/anchor named in the check output"
when-changed = ["**/*.md", "docs/contracts.toml", "scripts/docs.py", "scripts/doc_tools/**", "scripts/requirements-docs.txt", "scripts/test_doc_tools.py", "scripts/tests/**", "tests/fixtures/doc_tools/**", "do-harness.toml", ".github/workflows/verify.yml", ".github/workflows/release.yml"]

[[sensors]]
name = "check-agt"
argv = ["cargo", "test", "-p", "guardian-proxy", "--features", "agt-governance"]
when-changed = ["crates/guardian-proxy/**", "Cargo.toml", "Cargo.lock"]

[[sensors]]
name = "check-mcp"
argv = ["cargo", "test", "-p", "guardian-proxy", "--features", "mcp-surface"]
when-changed = ["crates/guardian-proxy/**", "Cargo.toml", "Cargo.lock"]

[[sensors]]
# Content guard for the policy record itself: every decision header keeps its
# required fields, no two entries repeat an invariant, and every `scripts/...`
# path a header points at still exists. Without it, the schema is validated
# only on `seed`/`init` and a stale or hand-edited entry sits unnoticed.
name = "check-invariants"
argv = ["bash", "scripts/check-invariants.sh"]
when-changed = ["plans/invariants.json", "do-harness.toml", "scripts/check-invariants.sh", "scripts/lib.sh"]

[[sensors]]
# Hermetic coherence gate for the *-promotion decisions: a recorded hold must
# match an off-by-default feature, and a recorded promote must match a
# default-enabled one. It exists because a promotion decision can silently drift
# from the shipped defaults across a long-lived epic, and because the GA watch
# itself cannot be a sensor (it exits 0 on every verdict and needs the network).
name = "check-promotions"
argv = ["bash", "scripts/check-promotion-decisions.sh"]
when-changed = ["plans/*-epic.md", "plans/invariants.json", "crates/guardian-proxy/Cargo.toml", "scripts/check-promotion-decisions.sh", "scripts/lib.sh"]

[[sensors]]
name = "audit"
argv = ["bash", "scripts/check-audit.sh"]
when-changed = ["Cargo.toml", "Cargo.lock", "scripts/check-audit.sh", "scripts/lib.sh"]

[[sensors]]
# Named constants over magic numbers (AGENTS.md section 5), mechanised. A
# numeric literal that is not a named constant and not one of the conventional
# values is a finding; the sensor is warn severity with a blessed baseline, so
# the existing debt is grandfathered and any increase is a hard regression.
# Deliberately absent from every [signal-sets] entry: any FINDINGS > 0 with a
# baseline records a warn verdict, and `verify --strict` / `status` stay honest
# by refusing green on warn, so a grandfathered count can never pass the
# strict gate (same reason `dora` and `coverage` stay out of `verification`).
name = "magic-numbers"
argv = ["bash", "scripts/check-magic-numbers.sh"]
severity = "warn"
when-changed = ["**/*.rs", "scripts/check-magic-numbers.sh", "scripts/check_magic_numbers.py", "scripts/lib.sh"]

[[sensors]]
# No `when-changed`: a commit message is not tied to any tracked path, so
# `commitlint` is always applicable. The pre-commit hook runs it on every
# commit, and the sensor stays cheap enough for that (it reads the message on
# stdin and matches conventional-commit prefixes).
name = "commitlint"
argv = ["bash", "scripts/check-commitlint.sh"]

[[sensors]]
name = "privacy"
argv = ["bash", "scripts/check-privacy.sh"]
when-changed = ["crates/do-harness/templates/**", ".agents/skills/**", "AGENTS.md", "scripts/check-privacy.sh", "scripts/lib.sh"]

[[sensors]]
# Executable half of the "untrusted text is data, never instructions" contract
# for the skills that ingest attacker-controlled text (pr-triage and
# issue-to-pr). The rule that none of it reaches a dynamic-execution sink used
# to be prose only, which AGENTS.md section 7 does not accept. Hermetic: reads
# the skill trees, runs nothing from them.
name = "untrusted-ingest"
argv = ["bash", "scripts/check-untrusted-ingest.sh"]
when-changed = [".agents/skills/pr-triage/**", ".agents/skills/issue-to-pr/**", "scripts/check-untrusted-ingest.sh", "scripts/lib.sh"]

[[sensors]]
# The CLI must work for every GitHub repository: a surface that ships to a
# consumer (CLI sources, scaffolded templates, release scripts) never names
# this repository where the *current* one is meant. The allowlist inside the
# script holds the tool's own identity links, each with a reason.
name = "repo-links"
argv = ["bash", "scripts/check-repo-links.sh"]
when-changed = ["crates/**/*.rs", "crates/do-harness/templates/**", "scripts/*.sh"]

[[sensors]]
# Executable half of the release-note contract: a published body carries the
# sections a reader needs. The release job runs `release-notes.sh compose` and
# `check` against the real body; this entry runs the hermetic controls, which
# prove the check can still fail (a bare generated dump, a surviving
# placeholder, an emptied section, a lost pull request).
name = "release-notes"
argv = ["bash", "scripts/release-notes.sh", "--self-test"]
when-changed = [".github/release-notes-template.md", ".github/release.yml", ".github/workflows/release.yml", ".github/workflows/auto-release.yml", "docs/releases/**", "scripts/release-notes.sh", "scripts/lib.sh"]

[[sensors]]
# Executable half of the release-derivation contract: the version a merge cuts
# is a function of the conventional commits since the last tag, and the policy
# (pre-1.0 breaking changes take the minor, features take a patch, a merge commit
# counts for nothing) is mirrored from the Rust ecosystem's release tooling
# rather than invented here. `auto-release.yml` calls `release-manager.sh next`
# on every push to main, so a classifier regression decides the wrong version
# silently; this entry pins the rules and the fail-closed guards around them.
name = "release-manager"
argv = ["bash", "scripts/release-manager.sh", "--self-test"]
when-changed = ["Cargo.toml", "integrations/npm/**", ".github/workflows/auto-release.yml", ".github/workflows/release.yml", "docs/releasing.md", "scripts/release-manager.sh", "scripts/lib.sh"]

[[sensors]]
# Release-gated end-to-end control for the release manager, deliberately absent
# from `verification`: it runs the real `prepare` path (a scratch
# `git worktree`, real cargo) and asserts `cargo metadata --locked` still
# succeeds after the bump, which the hermetic `--self-test` cannot prove because
# it fakes cargo on `PATH`. It needs a checkout, cargo, and a worktree, so it
# must not gate every pull request.
name = "release-manager-e2e"
argv = ["bash", "scripts/release-manager.sh", "--e2e"]
when-changed = ["Cargo.toml", "integrations/npm/**", "man/do-harness.1", "docs/releasing.md", "scripts/release-manager.sh", "scripts/lib.sh"]

[[sensors]]
# Hermetic half of the npm publisher contract, in the release set only: the
# publisher must not move the registry's `latest` dist-tag backwards when it
# publishes an out-of-order (recovery) version, so the self-test pins that rule
# and the registry-status handling without a token or a registry.
name = "publish-npm"
argv = ["bash", "scripts/publish-npm.sh", "--self-test"]
when-changed = ["scripts/publish-npm.sh", "integrations/npm/**", "scripts/lib.sh"]

[[sensors]]
# Executable half of the post-publication contract: a release is complete only
# when a consumer can verify it on every channel. Hermetic — the self-test judges
# supplied facts, and the `verify-published` job in release.yml supplies them from
# the network, so the same policy runs in CI and by hand.
name = "verify-published"
argv = ["bash", "scripts/verify-published.sh", "--self-test"]
when-changed = ["Cargo.toml", "crates/db/Cargo.toml", "docs/releasing.md", ".github/workflows/release.yml", "scripts/verify-published.sh", "scripts/lib.sh"]

[[sensors]]
# DORA deployment health, derived (never judged) from git history. Report-only:
# severity stays "warn" and the sensor is deliberately absent from every
# [signal-sets] entry until a blessed findings baseline exists, so a breach is
# advisory rather than a CI stop. Gating is then mechanical: `verify --record
# --only dora --bless` pins the current breach count into plans/baselines.json,
# after which apply_ratchet turns any increase into a hard failure even at warn
# severity, and a later bless can only lower the ceiling.
#
# No `when-changed` key: DORA is a whole-history measurement, not a per-file
# check, so the sensor must stay always-applicable. Listing source globs here
# would silently skip the sensor on every unrelated change, which is the
# failure mode that makes a metric disappear exactly when it should be read.
#
# `coverage-inputs` is what pins the policy: plans/dora.json defines every
# number, so editing a threshold makes prior dora evidence stale instead of
# silently incomparable.
name = "dora"
argv = ["bash", "scripts/check-dora.sh"]
severity = "warn"
coverage-inputs = ["plans/dora.json"]

[[sensors]]
# Feature-powerset sensor for guardian-proxy feature combinations (--features
# agt-governance / mcp-surface on/off). Exact-pin policy: dependency pins
# (agent-governance = "=3.2.2", rmcp = "=3.5.1") remain exact per policy;
# this sensor verifies all feature combinations build. Kept out of fast-loop hooks.
name = "powerset"
argv = ["bash", "scripts/check-powerset.sh"]
when-changed = ["crates/guardian-proxy/**", "Cargo.toml", "Cargo.lock", "scripts/check-powerset.sh", "scripts/lib.sh"]

[[sensors]]
# Unused-dependency pruning sensor using cargo-machete. Exact-pin policy: pins stay exact;
# this sensor verifies no unused dependencies exist across workspace manifests. Kept out of fast-loop hooks.
name = "machete"
argv = ["bash", "scripts/check-machete.sh"]
when-changed = ["**/Cargo.toml", "Cargo.lock", "scripts/check-machete.sh", "scripts/lib.sh"]

# Optional context-sanitization check.
#
# The harness does not mediate context: it never captures prompts, tool
# arguments, or vault contents. This sensor proves that a configured
# sanitizer transforms one synthetic fixture, and nothing more. The evidence
# is capability evidence about the fixture — it is not proof that a real
# coding client routes every outbound byte through the sanitizer. Client
# registration is a client-specific integration:
# https://github.com/d-oit/do-context-shield/blob/main/docs/client-integration.md
#
# The check is off unless DO_HARNESS_CONTEXT_SANITIZATION=enabled, and
# DO_CONTEXT_SHIELD_BIN must name the executable when it is on. An unset mode
# reports "SKIP: context-sanitization: not configured", which strict
# verification treats as missing verification rather than as a pass.
#
# The script is the canonical helper, copied from
# `crates/do-harness/templates/scripts/check-context-sanitization.py`; install
# it into `scripts/` before uncommenting the block below.
#
# [[sensors]]
# name = "context-sanitization"
# argv = ["python3", "scripts/check-context-sanitization.py"]
# severity = "error"
# timeout = 45

[[sensors]]
# Automated check for CI concurrency guardrails, Windows test timeouts,
# coverage wave reduction, and environment bounds. Runs self-tests to prove
# negative mutation controls.
name = "ci-concurrency-guardrails"
argv = ["python3", "scripts/check_ci_concurrency_guardrails.py", "--self-test"]
when-changed = [
    ".github/workflows/**",
    "crates/do-harness/tests/concurrency.rs",
    "scripts/check_ci_concurrency_guardrails.py",
    "do-harness.toml"
]

[[sensors]]
name = "workflow-benchmark"
argv = ["python3", "scripts/workflow-benchmark.py", "--self-test"]
# Measured 19.8s for the 12 self-tests on an idle machine (each of the six
# synthetic cases runs the harness), so the previous 30s ceiling left 10s of
# headroom and failed the pre-push gate whenever a build shared the box.
timeout = 120
when-changed = ["benchmarks/**", "scripts/workflow-benchmark.py", "scripts/workflow_benchmark/**", "do-harness.toml"]

[[sensors]]
name = "ci-workflow-costs"
argv = ["python3", "scripts/ci_workflow_costs.py", "--check"]
when-changed = ["scripts/ci_workflow_costs.py", "plans/ci-workflow-costs.json", ".github/workflows/**"]

[[sensors]]
name = "latest-main-guardrails"
argv = ["python3", "scripts/tests/test_latest_main.py"]
when-changed = [
    "AGENTS.md",
    "do-harness.toml",
    "plans/invariants.json",
    "scripts/tests/test_latest_main.py",
    ".agents/skills/harness/**",
    ".agents/skills/htn-planner/**",
