version = 1

# Contract rules for documentation inventory and link verification.
# Every rule must carry a classification and an explicit reason.
# Allowed classifications: "maintained", "historical", "fixture", "vendored", "canonical_alias".

[[rules]]
path = "README.md"
classification = "maintained"
reason = "Root repository README documentation."

[[rules]]
path = "AGENTS.md"
classification = "maintained"
reason = "Repository-wide agent instructions and guidelines."

[[rules]]
path = "SECURITY.md"
classification = "maintained"
reason = "Security disclosure and contact policy."

[[rules]]
glob = "docs/*.md"
classification = "maintained"
reason = "Maintained top-level documentation under docs/."

[[rules]]
glob = "docs/releases/*.md"
classification = "historical"
reason = "Historical release notes and version changelogs."

[[rules]]
glob = "integrations/*/README.md"
classification = "maintained"
reason = "Maintained integration README entry points."

[[rules]]
path = "crates/do-harness/README.md"
classification = "canonical_alias"
canonical_target = "README.md"
reason = "Symlink alias to root README.md for published do-harness crate."

[[rules]]
glob = "crates/*/README.md"
classification = "maintained"
reason = "Maintained crate README entry points."

[[rules]]
glob = "vendor/**"
classification = "vendored"
reason = "Upstream vendored library documentation."

[[rules]]
glob = "tests/fixtures/**"
classification = "fixture"
reason = "Test fixture markdown documents."

[[rules]]
glob = "crates/do-harness/tests/fixtures/**"
classification = "fixture"
reason = "Test fixture markdown documents in do-harness crate."

[[rules]]
glob = "crates/do-harness/templates/**"
classification = "fixture"
reason = "Scaffold template markdown documents."

[[rules]]
glob = ".agents/skills/**"
classification = "fixture"
reason = "Skill catalog definitions and reference documents."

[[rules]]
glob = "plans/*.md"
classification = "maintained"
reason = "Maintained architecture and epic design plans."

[[rules]]
glob = "scripts/selection-impact/*.md"
classification = "maintained"
reason = "Maintained benchmark and selection experiment documentation."

[[rules]]
glob = ".github/*.md"
classification = "maintained"
reason = "GitHub workflow templates and guidelines."

[[impact_map]]
path = "crates/do-harness/src/cli.rs"
sections = ["README.md#commands", "docs/cli.md#subcommands"]
reason = "Clap command definitions drive the CLI reference and README command table."

[[impact_map]]
glob = "crates/do-harness/src/cli/**"
sections = ["README.md#commands", "docs/cli.md#subcommands"]
reason = "CLI command modules can change documented command behavior."

[[impact_map]]
path = "crates/do-harness/src/init.rs"
sections = ["README.md#use-in-another-repo", "docs/adoption.md#initialize-the-repository", "docs/adoption.md#configure-sensors-for-your-stack"]
reason = "Initialization behavior defines the adoption quickstart and generated configuration."

[[impact_map]]
glob = "crates/do-harness/src/init/**"
sections = ["README.md#use-in-another-repo", "docs/adoption.md#initialize-the-repository", "docs/adoption.md#configure-sensors-for-your-stack"]
reason = "Initialization modules define the adoption quickstart and generated configuration."

[[impact_map]]
glob = "crates/do-harness/templates/**"
sections = ["README.md#use-in-another-repo", "docs/adoption.md#initialize-the-repository", "docs/adoption.md#configure-sensors-for-your-stack", "docs/adoption.md#ci-snippets"]
reason = "Scaffold templates are part of the documented adoption and CI contract."

[[impact_map]]
path = "do-harness.toml"
sections = ["README.md#ci", "docs/adoption.md#ci-snippets", "AGENTS.md#4-cli-tool-protocol--guardrails"]
reason = "Sensor and signal-set configuration determines the documented verification gates."

[[impact_map]]
glob = ".github/workflows/**"
sections = ["README.md#ci", "docs/adoption.md#ci-snippets", "AGENTS.md#4-cli-tool-protocol--guardrails"]
reason = "Workflow wiring is part of the documented CI contract."

[[impact_map]]
path = "crates/do-harness/src/report.rs"
sections = ["README.md#json-output", "docs/cli.md#verify", "docs/adoption.md#the-agent-loop"]
reason = "Serialized verification reports are represented by the JSON output examples."

[[impact_map]]
path = "crates/do-harness/src/pr/review.rs"
sections = ["README.md#json-output", "docs/cli.md#pr-review"]
reason = "PR review report serialization is represented by the JSON and command reference."

[[impact_map]]
glob = "crates/do-harness/src/evidence/**"
sections = ["README.md#json-output", "docs/cli.md#verify", "docs/adoption.md#the-agent-loop"]
reason = "Evidence serialization affects the documented JSON output and agent loop."

[[impact_map]]
glob = "crates/do-harness/src/**"
sections = []
reason = "Catch-all: unmapped Rust source may affect documented behavior; manual raw review is required."
