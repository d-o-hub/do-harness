[package]
name = "do-harness"
description = "Unified CLI for the do-harness agent execution harness sensors and database maintenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# The published surface is a binary, so the crate's documentation is the CLI
# reference rather than a rendered library API: `docs.rs` cannot build a crate
# with no library target, and `src/lib.rs` exists only to give it a landing page.
documentation = "https://github.com/d-o-hub/do-harness/blob/main/docs/cli.md"
keywords = ["agents", "harness", "verification", "sensors", "ci"]
categories = [
    "command-line-utilities",
    "development-tools",
    "development-tools::testing",
]

# Prebuilt binaries are published as GitHub release assets named
# `do-harness-v<version>-<target>.tar.gz` with an inner
# `do-harness-v<version>-<target>/do-harness` layout, which matches the
# cargo-binstall defaults once `repository` is set. QuickInstall ships
# third-party binaries, so it is disabled on supply-chain grounds; compile
# from source stays available as the last-resort strategy.
[package.metadata.binstall]
disabled-strategies = ["quick-install"]

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
clap_complete.workspace = true
clap_mangen.workspace = true
globset.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
tempfile.workspace = true
do-harness-db = { path = "../db", version = "0.1.2" }
do-harness-types = { path = "../types", version = "0.1.2" }

[dev-dependencies]