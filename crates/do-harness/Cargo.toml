[package]
name = "do-harness"
description = "Unified CLI for the do-harness agent execution harness sensors and database maintenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
agt-governance = ["dep:agent-governance", "dep:serde_yaml"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
sha2.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
tempfile.workspace = true
do-harness-db = { path = "../db", version = "0.1.0" }
do-harness-types = { path = "../types", version = "0.1.0" }
libsql = { workspace = true, features = ["core"] }
agent-governance = { version = "3.2", optional = true }
serde_yaml = { version = "0.9", optional = true }

[dev-dependencies]