# Example guardian-proxy config — copy to guardian-proxy.toml and adjust.
# Supports JSON or TOML (JSON tried first). Unknown fields are rejected.
bind = "127.0.0.1:8787"
upstream = "http://127.0.0.1:9000"
agent_id = "dev-agent"
# Optional hash-chained JSONL decision log (created if missing).
audit_log = "guardian-audit.jsonl"
# SSRF policy: link-local/metadata upstreams are always rejected; loopback and
# private upstreams require this opt-in (development sidecars).
allow_private_upstreams = true
# Optional exact host allowlist; empty permits any non-denied host.
upstream_allowlist = []
# Optional bearer token required on GET /metrics.
# metrics_token = "change-me"
