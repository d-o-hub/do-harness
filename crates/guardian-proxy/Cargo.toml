[package]
name = "guardian-proxy"
description = "Optional fail-closed guardian proxy (adjacent to do-harness dev harness) — off by default, requires agt-governance for AGT checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Internal crate: this workspace publishes exactly three crates to crates.io
# (`do-harness-types`, `do-harness-db`, `do-harness`, in that order). The proxy is
# an adjacent, off-by-default sidecar that a do-harness user builds from the
# repository, so `cargo publish -p guardian-proxy` must fail rather than ship a
# crate whose release metadata (no `repository`, no `readme`, no keywords) was
# never prepared. Cargo enforces this flag, so nothing else has to.

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap = { workspace = true, features = ["derive"] }
do-harness-types = { path = "../types", version = "0.1.2" }
fs2.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync"] }
toml.workspace = true
tower.workspace = true
agent-governance = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
thiserror.workspace = true

[features]
default = []
agt-governance = ["dep:agent-governance", "dep:serde_yaml"]
# rmcp requires Rust 1.88; default builds and the MSRV job stay on 1.85.
mcp-surface = ["dep:rmcp"]
