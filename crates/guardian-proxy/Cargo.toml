[package]
name = "guardian-proxy"
description = "Optional fail-closed guardian proxy (adjacent to do-harness dev harness) — off by default, requires agt-governance for AGT checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap = { workspace = true, features = ["derive"] }
hex.workspace = true
http-body-util.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync"] }
toml.workspace = true
tower.workspace = true
do-harness-types = { path = "../types", version = "0.1.0" }
agent-governance = { version = "3", optional = true }
serde_yaml = { version = "0.9", optional = true }

[features]
default = []
agt-governance = ["dep:agent-governance", "dep:serde_yaml"]
