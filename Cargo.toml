[workspace]
resolver = "3"
members = ["crates/db", "crates/types", "crates/do-harness", "crates/guardian-proxy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
libsql = { version = "0.9", default-features = false }
tokio = { version = "1", features = ["rt", "macros"] }
anyhow = "1"
serde = "1"
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
toml = "0.9"
tempfile = "3"

# Dev-profile tuning lives here (Cargo only honors [profile.*] in manifests,
# never in .cargo/config.toml).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Groups run at lower priority so the deny-level panicking lints below win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic; test modules opt out locally.
unwrap_used = "deny"
expect_used = "deny"