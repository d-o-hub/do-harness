[workspace]
resolver = "3"
members = ["crates/db", "crates/types", "crates/do-harness", "crates/guardian-proxy"]
# Third-party code retains its own lint/test baseline and release version.
exclude = ["vendor/libsql"]

[workspace.package]
version = "0.3.5"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/d-o-hub/do-harness"

[workspace.dependencies]
# The version survives Cargo package normalization; consumers receive the same
# teardown fix as checkout builds without a workspace-local patch.
libsql = { package = "do-harness-libsql", version = "0.9.30", path = "vendor/libsql", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "fs", "process", "sync", "time"] }
anyhow = "1"
serde = "1"
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
fs2 = "0.4"
globset = "0.4"
hex = "0.4"
sha2 = "0.10"
toml = "0.9"
tempfile = "3"
serde_yaml = "0.9"
# API-compatible fork of serde_yaml 0.9 (same from_str/Value API). The fork
# links unsafe-libyaml-norway (a distinct crate, no RUSTSEC-2024-0449) instead
# of the archived unsafe-libyaml, so the unconditional frontmatter path in
# crates/do-harness stays on a maintained YAML stack. serde_yaml itself stays
# (optional, guardian-proxy only) because the retired agent-governance 3.2.2
# SDK names serde_yaml::Value in its execute_with_governance signature — and
# the live agentmesh 4.x line still depends on serde_yaml 0.9 too — so the
# SDK-typed call site cannot migrate until the SDK does. See
# plans/serde-yaml-migration.md.
serde_norway = "0.9"
axum = { version = "0.7" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.5" }
http-body-util = "0.1"
parking_lot = "0.12"
# Exact pin (exemption from the caret-range policy in AGENTS.md): the
# Agent Governance Toolkit Rust SDK is pre-GA (upstream CHANGELOG: "all releases
# are currently public preview releases"), so floating it risks silent API
# drift. NOTE: upstream renamed this crate `agent-governance` -> `agentmesh`;
# the retired name is frozen at 3.2.2 (2026-04-22) and the live crate is
# `agentmesh` (4.0.0). This pin therefore deliberately still points at the
# retired 3.2.x line: migrating to `agentmesh` 4.x is a breaking API change
# (serde_yaml -> agentmesh::policy_data) tracked by the `chore-agt-promotion`
# gate, not a routine bump. Update with
# `cargo update -p agent-governance --precise <ver>` and re-run
# `cargo deny check` + `cargo audit`; see plans/agt-governance-epic.md
# (chore-agt-promotion gate) before removing the pin.
agent-governance = "=3.2.2"
# Exact pin (same policy as the AGT SDK pin): rmcp 3.x is the official Rust
# MCP SDK and still evolving. Only guardian-proxy's optional `mcp-surface`
# feature enables it. Update with `cargo update -p rmcp --precise <ver>` and
# re-run `cargo deny check` + `cargo audit`; see plans/mcp-conformance-epic.md
# before bumping.
rmcp = { version = "=3.5.1", features = ["server", "transport-streamable-http-server", "macros"] }

# Dev-profile tuning lives here (Cargo only honors [profile.*] in manifests,
# never in .cargo/config.toml). Build-override stays at Cargo defaults
# (opt-level 0): optimizing build scripts raises peak RSS for no runtime gain.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Fast-CI profile alias where full release optimization is overkill.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Note for contributors: when touching async code, follow workload-aware Tokio
# performance guidance (template #336, .agents/skills/tokio-performance/SKILL.md).
# Groups run at lower priority so the deny-level panicking lints below win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic; test modules opt out locally.
unwrap_used = "deny"
expect_used = "deny"
