[workspace]
resolver = "3"
members = ["crates/db", "crates/types", "crates/do-harness", "crates/guardian-proxy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
libsql = { version = "0.9", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "fs", "process", "sync", "time"] }
anyhow = "1"
serde = "1"
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
fs2 = "0.4"
hex = "0.4"
sha2 = "0.10"
toml = "0.9"
tempfile = "3"
serde_yaml = "0.9"
axum = { version = "0.7" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.5" }
http-body-util = "0.1"
# Exact pin (exemption from the caret-range policy in AGENTS.md): the
# agent-governance toolkit is pre-GA (Public Preview, max_stable 3.2.2), so
# floating it risks silent API drift. Update with
# `cargo update -p agent-governance --precise <ver>` and re-run
# `cargo deny check` + `cargo audit`; see plans/agt-governance-epic.md
# (chore-agt-promotion gate) before removing the pin.
agent-governance = "=3.2.2"

# Dev-profile tuning lives here (Cargo only honors [profile.*] in manifests,
# never in .cargo/config.toml).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Groups run at lower priority so the deny-level panicking lints below win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic; test modules opt out locally.
unwrap_used = "deny"
expect_used = "deny"