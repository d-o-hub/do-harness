[workspace]
resolver = "3"
members = ["crates/db", "crates/types", "crates/do-harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
libsql = { version = "0.9", default-features = false }
tokio = { version = "1", features = ["rt", "macros"] }
anyhow = "1"
serde = "1"
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.9"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"